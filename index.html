  --olumlu: #1C7248;
  --uyari: #8A5A00;
  --h-deniz: #C9DCE7;

  --h-kara-2: #E2E7E1;
  --h-cizgi: #A7B4AF;

}

    --vurgu-soluk: #232326; --secim: #F2F2F0; --secim-ustu: #111111; --olumlu: #6FCB9B; --uyari: #E2B45A;
    --h-deniz: #0C202B; --h-kara: #1E2C2E; --h-kara-2: #172325; --h-cizgi: #3F5356;

html { height: 100%; box-sizing: border-box; }
body { height: 100%; margin: 0; background: var(--zemin); color: var(--murekkep); font: 400 15px/1.45 var(--yazi); -webkit-text-size-adjust: 100%; }
.uyg, .uyg *, .uyg *::before, .uyg *::after { box-sizing: border-box; }
.uyg :focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; }
.gorunmez { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- iskelet ---------- */
.uyg {
  height: 100%;
  display: grid;
  grid-template-columns: 300px 384px minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "ust ust ust" "panel sonuc harita";
}
.ust { grid-area: ust; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--yuzey); border-bottom: 1px solid var(--cizgi); }

.dugme { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid var(--cizgi-koyu); border-radius: 10px; background: var(--yuzey-2); color: var(--murekkep); font: 600 15px/1 var(--yazi-dar); cursor: pointer; text-decoration: none; }

.rozet { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 14px; background: var(--vurgu-dolgu); color: var(--vurgu-ustu); font: 600 12px/1 var(--yazi-dar); font-variant-numeric: tabular-nums; }
.bag { padding: 6px 2px; border: 0; background: none; color: var(--vurgu); font: 600 14px/1 var(--yazi-dar); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* ---------- filtre paneli ---------- */
.panel { grid-area: panel; display: flex; flex-direction: column; min-height: 0; background: var(--yuzey); border-right: 1px solid var(--cizgi); }

.alan label { color: var(--soluk); font: 500 13px/1.2 var(--yazi-dar); }
.alan select, .ara { width: 100%; min-height: 40px; padding: 6px 10px; border: 1px solid var(--cizgi-koyu); border-radius: 10px; background: var(--yuzey-2); color: var(--murekkep); font: 500 15px/1.2 var(--yazi); }
.ara::placeholder { color: var(--soluk); opacity: 1; }
.adet { color: var(--soluk); font: 500 12.5px/1 var(--yazi-dar); font-variant-numeric: tabular-nums; }

.haplar { display: flex; flex-wrap: wrap; gap: 6px; }
.hap { position: relative; }

.hap input:checked + .hap-yuz { border-color: var(--vurgu-dolgu); background: var(--vurgu-dolgu); color: var(--vurgu-ustu); }

.anahtar { flex-direction: row; align-items: center; gap: 10px; min-height: 40px; padding: 2px 0; border-top: 1px solid var(--cizgi); border-bottom: 1px solid var(--cizgi); margin-block: -10px; }
.anahtar + .anahtar { border-top: 0; margin-top: -10px; }
.anahtar label { flex: 1; min-width: 0; padding: 8px 0; font: 500 15px/1.2 var(--yazi); cursor: pointer; }
.anahtar-giris { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 42px; height: 24px; margin: 0; border-radius: 16px; background: var(--cizgi-koyu); cursor: pointer; transition: background-color .15s; }
.anahtar-giris::before { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--yuzey-2); transition: transform .15s; }
.anahtar-giris:checked { background: var(--vurgu-dolgu); }
.anahtar-giris:checked::before { transform: translateX(18px); background: var(--vurgu-ustu); }

.grup-bas { display: flex; align-items: baseline; gap: 8px; }
.secili-sayi { color: var(--vurgu); font: 600 12.5px/1 var(--yazi-dar); }
.cok { list-style: none; margin: 0; padding: 0; }
.cok-oge label { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 5px 2px; border-bottom: 1px solid var(--cizgi); cursor: pointer; }
.cok-oge input { flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--vurgu-dolgu); cursor: pointer; }
.cok-ad { flex: 1; min-width: 0; font: 400 15px/1.25 var(--yazi); }
.cok-oge.bos .cok-ad { color: var(--soluk); }
.ipucu { margin: 0; color: var(--soluk); font-size: 13px; }

/* ---------- sonuçlar ---------- */
.sonuclar { grid-area: sonuc; min-height: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--zemin); border-right: 1px solid var(--cizgi); }
.sonuc-bas { position: sticky; top: 0; z-index: 2; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 10px; background: var(--zemin); }
.sonuc-sayi { margin: 0; font: 600 23px/1.1 var(--yazi-dar); font-variant-numeric: tabular-nums; }
.sonuc-not { margin: -4px 0 0; color: var(--soluk); font-size: 13.5px; }
.kat-baglanti { display: flex; flex-direction: column; gap: 6px; }
.kat-baglanti a { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--vurgu); border-radius: 12px; background: var(--vurgu-soluk); color: var(--vurgu); font: 600 14.5px/1.25 var(--yazi-dar); text-decoration: none; }
.kat-baglanti a:hover { text-decoration: underline; text-underline-offset: 2px; }
.kat-baglanti .kb-kaynak { display: block; color: var(--soluk); font-weight: 500; font-size: 12.5px; }
.kat-baglanti .kb-ok { flex: none; font-size: 16px; }
.ms-govde > .kat-baglanti { margin: 0; }
.cipler { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.cip { display: inline-flex; align-items: center; max-width: 100%; border-radius: 10px; background: var(--vurgu-soluk); color: var(--murekkep); font: 500 14px/1.15 var(--yazi-dar); }
.cip-ad { min-width: 0; padding: 7px 2px 7px 10px; overflow-wrap: anywhere; }
.cip button { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 10px; background: none; color: inherit; cursor: pointer; }
.liste { list-style: none; margin: 0; padding: 2px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.kart { min-width: 0; border: 1px solid var(--cizgi); border-radius: 12px; background: var(--yuzey-2); }
.kart.secili { border-color: var(--vurgu); box-shadow: 0 0 0 1px var(--vurgu); }
.kart-bas { display: block; width: 100%; padding: 12px 14px 2px; border: 0; border-radius: 12px 12px 0 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.kart { position: relative; }
.kart-bas { padding-right: 92px; }
.favori { position: absolute; top: 6px; right: 6px; display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 12px; background: none; color: var(--soluk); cursor: pointer; }
.favori:hover { background: var(--vurgu-soluk); color: var(--murekkep); }
.favori .simge { width: 20px; height: 20px; stroke-width: 1.5; }
.favori[aria-pressed="true"] { color: var(--uyari); }
.favori[aria-pressed="true"] .simge path { fill: var(--secim); }
.liste-dugme { right: 44px; }
.not-satiri { display: block; }
.not-satiri + .not-satiri { margin-top: 6px; }
.kart-tur { display: block; margin-bottom: 3px; color: var(--soluk); font: 600 12px/1.2 var(--yazi-dar); letter-spacing: .04em; text-transform: uppercase; }
.liste-dugme[aria-pressed="true"] { color: var(--vurgu); }
.liste-dugme[aria-pressed="true"] .simge path { fill: none; }
.liste-grup { flex-direction: row; align-items: flex-end; gap: 10px; }
.liste-grup .alan { flex: 1; }
.liste-grup .bag { flex: none; min-height: 40px; }
.paylasilan { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; padding: 12px 14px; border: 1px solid var(--vurgu); border-radius: 12px; background: var(--vurgu-soluk); }
.paylasilan p { margin: 0; font: 500 15px/1.3 var(--yazi); overflow-wrap: anywhere; }
.paylasilan .eylemler .dugme { min-height: 36px; }
.diger-yerler { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 6px; color: var(--soluk); font-size: 13.5px; }
.diyalog { width: min(480px, calc(100vw - 24px)); max-height: min(640px, calc(100dvh - 24px)); padding: 0; border: 1px solid var(--cizgi-koyu); border-radius: 14px; background: var(--yuzey); color: var(--murekkep); box-shadow: var(--golge); }
.diyalog::backdrop { background: rgb(0 0 0 / .45); }
.diyalog-ic { display: flex; flex-direction: column; gap: 14px; padding: 16px; }
.diyalog-bas { display: flex; align-items: flex-start; gap: 10px; }
.diyalog-baslik { flex: 1; min-width: 0; margin: 0; font: 600 18px/1.25 var(--yazi-dar); overflow-wrap: anywhere; }
.diyalog .ipucu { margin: 0; }
.diyalog .kapat { display: grid; place-items: center; flex: none; margin: -6px -8px 0 0; }
.liste-satirlari { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.liste-satirlari > li { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--cizgi); }
.liste-satirlari label { display: flex; align-items: center; gap: 10px; min-height: 32px; cursor: pointer; }
.liste-satirlari input[type=checkbox] { flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--vurgu-dolgu); }
.liste-ad { flex: 1; min-width: 0; font: 600 15.5px/1.25 var(--yazi-dar); overflow-wrap: anywhere; }
.liste-ust { display: flex; align-items: baseline; gap: 8px; }
.liste-eylem { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.liste-eylem .bag { padding: 4px 0; font-size: 13.5px; }
.bag.tehlike { color: var(--uyari); }
.yeni-liste { display: flex; gap: 8px; }
.yeni-liste .ara { flex: 1; min-width: 0; }
.paylas-kutu { display: flex; flex-direction: column; gap: 6px; }
.paylas-kutu .ara { font-size: 13px; }
.kart-ad { display: block; font: 600 17.5px/1.22 var(--yazi-dar); text-wrap: balance; }
.kart-adres { display: block; margin-top: 4px; color: var(--soluk); font-size: 13.5px; line-height: 1.35; }
.ozet { list-style: none; margin: 0; padding: 8px 14px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 5px 12px; font: 500 13.5px/1.2 var(--yazi-dar); }
.tip { padding: 3px 7px 2px; border: 1px solid var(--cizgi-koyu); border-radius: 6px; font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.olgu { display: inline-flex; align-items: center; gap: 4px; }
.olgu.var { color: var(--olumlu); }
.olgu.yok, .olgu.bilinmiyor, .olgu.yersiz { color: var(--soluk); }
.olgu.bilinmiyor { text-decoration: underline dashed; text-underline-offset: 3px; }
.simge { flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.neden { margin: 0; padding: 0 14px 12px; color: var(--uyari); font: 500 13.5px/1.3 var(--yazi-dar); }

.ayrinti { display: flex; flex-direction: column; gap: 12px; padding: 12px 14px 14px; border-top: 1px solid var(--cizgi); }
.bilgi { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14px; }
.bilgi dt { color: var(--soluk); font: 500 13.5px/1.45 var(--yazi-dar); }
.bilgi dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.bilgi .genis { grid-column: 1 / -1; }
.bilgi dt.genis { margin-top: 4px; }
.bilgi .bilinmiyor { color: var(--soluk); font-style: italic; }
.teyit { display: inline-block; margin-left: 4px; padding: 1px 6px; border: 1px dashed var(--uyari); border-radius: 6px; color: var(--uyari); font: 500 12px/1.3 var(--yazi-dar); white-space: nowrap; }
.kart-adres .yaklasik { color: var(--soluk); font-style: italic; }
.yaklasik-not { display: block; margin-top: 4px; color: var(--soluk); font-size: 13px; }
.dallar { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.dallar li { padding: 3px 7px 2px; border: 1px solid var(--cizgi); border-radius: 6px; font: 500 13px/1.2 var(--yazi-dar); }
.dallar.uzun { max-height: 172px; overflow-y: auto; padding: 6px; border: 1px solid var(--cizgi); border-radius: 10px; }
.dallar li.aranan { border-color: var(--vurgu); background: var(--vurgu-soluk); font-weight: 600; }
.tel { color: inherit; font-variant-numeric: tabular-nums; text-decoration: none; user-select: all; -webkit-user-select: all; }
.kopya { margin-left: 8px; padding: 2px 2px; font-size: 13px; }
.uyari-not { margin: 0; color: var(--uyari); font: 500 13.5px/1.3 var(--yazi-dar); }
.kaynak-satiri { margin: 0; color: var(--soluk); font-size: 13px; }
.kaynak-satiri a { color: inherit; text-underline-offset: 2px; }
.eylemler { display: flex; flex-wrap: wrap; gap: 8px; }
.eylemler .dugme { min-height: 38px; padding: 6px 12px; font-size: 14.5px; }

.bos-durum { padding: 18px 16px; border: 1px dashed var(--cizgi-koyu); border-radius: 12px; color: var(--soluk); }
.bos-durum p { margin: 0 0 10px; }
.ilce-dugmeleri { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.raflar-bolge { list-style: none; margin: 0; padding: 0; }
.belirsiz { margin: 4px 16px 20px; padding-top: 12px; border-top: 1px dashed var(--cizgi-koyu); }
.belirsiz > summary { padding: 4px 0; font: 600 15px/1.2 var(--yazi-dar); cursor: pointer; }
.belirsiz > p { margin: 6px 0 10px; color: var(--soluk); font-size: 13.5px; }
.belirsiz .liste { padding: 0; }
.belirsiz .kart { border-style: dashed; background: none; }
.kaynak-notu { margin: 0; padding: 2px 16px 22px; color: var(--soluk); font-size: 13px; }

/* ---------- harita ---------- */
.harita-kap { grid-area: harita; position: relative; min-width: 0; min-height: 0; background: var(--h-deniz); }
#harita { position: absolute; inset: 0; z-index: 0; isolation: isolate; }
.harita-not { position: absolute; z-index: 1; top: 12px; left: 12px; max-width: calc(100% - 24px); margin: 0; padding: 5px 10px 4px; border: 1px solid var(--cizgi); border-radius: 10px; background: var(--yuzey); color: var(--soluk); font: 500 13px/1.25 var(--yazi-dar); box-shadow: var(--golge); }
.koor-kutu { position: absolute; z-index: 1; left: 12px; bottom: 30px; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); padding: 6px 8px 6px 12px; border: 1px solid var(--cizgi-koyu); border-radius: 10px; background: var(--yuzey); box-shadow: var(--golge); font: 500 14px/1.2 var(--yazi-dar); }
.koor-kutu output { font: 600 15px/1 var(--yazi-dar); font-variant-numeric: tabular-nums; user-select: all; -webkit-user-select: all; }
.koor-modu { cursor: crosshair !important; }
.konum-not { top: auto; bottom: 30px; max-width: calc(100% - 66px); }

/* ziyaretçinin konumu: mavi nokta, doğruluk dairesi; konum yalnızca tarayıcıda kullanılır */
.konum-nokta { border: 0; background: none; }
.konum-nokta span { position: absolute; inset: 0; border: 3px solid #fff; border-radius: 50%; background: var(--vurgu-dolgu); box-shadow: 0 0 0 1px rgb(0 0 0 / .2), 0 1px 5px rgb(0 0 0 / .35); }
.konum-nokta span::after { content: ""; position: absolute; inset: -9px; border: 2px solid var(--vurgu-dolgu); border-radius: 50%; opacity: 0; animation: konum-dalga 2s ease-out infinite; }
@keyframes konum-dalga { from { transform: scale(.4); opacity: .7; } to { transform: scale(1.2); opacity: 0; } }
.konum-daire { fill: var(--vurgu-dolgu); fill-opacity: .1; stroke: var(--vurgu-dolgu); stroke-opacity: .45; stroke-width: 1; }
.leaflet-bar .konum-dugme[aria-pressed="true"] { background: var(--vurgu-soluk); color: var(--vurgu); }
.konum-dugme.bekliyor .simge { animation: konum-bekle .9s ease-in-out infinite alternate; }
@keyframes konum-bekle { to { opacity: .3; } }
.uzaklik { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 6px; background: var(--vurgu-soluk); color: var(--vurgu); font: 600 12.5px/1.4 var(--yazi-dar); font-variant-numeric: tabular-nums; white-space: nowrap; }

.leaflet-container { background: var(--h-deniz); font: inherit; }
.leaflet-container a { color: var(--vurgu); }
.leaflet-bar, .leaflet-touch .leaflet-bar { border: 1px solid var(--cizgi); border-radius: 12px; box-shadow: var(--golge); overflow: hidden; }
.leaflet-bar a, .leaflet-bar button { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-bottom: 1px solid var(--cizgi); border-radius: 0; background: var(--yuzey-2); color: var(--murekkep); line-height: 1; cursor: pointer; }
.leaflet-touch .leaflet-bar a { width: 34px; height: 34px; line-height: 1; }
.leaflet-bar a:last-child, .leaflet-bar button:last-child { border-bottom: 0; }
.leaflet-bar a:hover, .leaflet-bar a:focus, .leaflet-bar button:hover { background: var(--zemin); color: var(--murekkep); }
.leaflet-bar a.leaflet-disabled { background: var(--zemin); color: var(--cizgi-koyu); }
.leaflet-bar .koor-dugme { width: auto; padding: 0 10px; font: 600 13.5px/1 var(--yazi-dar); }
.leaflet-bar .koor-dugme[aria-pressed="true"] { background: var(--secim); color: var(--secim-ustu); }
.leaflet-container .leaflet-control-attribution { background: var(--yuzey); color: var(--soluk); font: 400 11px/1.5 var(--yazi); opacity: .92; }
.leaflet-tooltip { padding: 5px 9px; border: 0; border-radius: 8px; background: var(--murekkep); color: var(--yuzey); font: 500 13.5px/1.25 var(--yazi-dar); box-shadow: var(--golge); }
.leaflet-tooltip-top::before { border-top-color: var(--murekkep); }
.leaflet-tooltip-bottom::before { border-bottom-color: var(--murekkep); }
.leaflet-tooltip-left::before { border-left-color: var(--murekkep); }
.leaflet-tooltip-right::before { border-right-color: var(--murekkep); }

.sinir { fill-opacity: 1; stroke-opacity: 1; stroke-linejoin: round; }
.sinir-ilce { fill: var(--h-kara); stroke: var(--h-cizgi); stroke-width: 1; }
.sinir-mahalle { fill: var(--h-kara); stroke: var(--h-cizgi); stroke-width: .8; stroke-dasharray: 3 3; }
.sinir-secili { fill: none; stroke: var(--vurgu-dolgu); stroke-width: 2.5; }
.yer-adi span { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; color: var(--soluk); font: 500 12px/1 var(--yazi-dar); text-shadow: 0 0 3px var(--h-kara), 0 0 3px var(--h-kara), 0 0 3px var(--h-kara); }
.yer-ilce span { font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.yer-mahalle, .uzak .yer-ilce, .yakin .yer-ilce { display: none; }
.yakin .yer-mahalle { display: block; }

/* iğne kümeleri (Leaflet.markercluster): yakın iğneler sayılı tek daireye toplanır */
.leaflet-cluster-anim .leaflet-marker-icon, .leaflet-cluster-anim .leaflet-marker-shadow { transition: transform .3s ease-out, opacity .3s ease-in; }
.leaflet-cluster-spider-leg { transition: stroke-dashoffset .3s ease-out, stroke-opacity .3s ease-in; }
.kume { border: 0; background: none; }
.kume span { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--vurgu-dolgu); color: var(--vurgu-ustu); font: 700 15px/1 var(--yazi-dar); font-variant-numeric: tabular-nums; box-shadow: 0 0 0 3px var(--yuzey-2), 0 2px 8px rgb(0 0 0 / .35); }
.kume:focus-visible { outline: 0; }
.kume:focus-visible span { box-shadow: 0 0 0 3px var(--yuzey-2), 0 0 0 6px var(--vurgu); }

.igne { border: 0; background: none; }
.igne .levha { position: absolute; left: 1px; top: 1px; width: 28px; height: 28px; border-radius: 10px; font-size: 17px; box-shadow: 0 0 0 2px var(--yuzey-2), 0 2px 6px rgb(0 0 0 / .4); transform-origin: 50% 39px; transition: transform .12s; }
.igne .levha::after { content: ""; position: absolute; left: 50%; top: 100%; margin: 1px 0 0 -6px; border: 6px solid transparent; border-top: 9px solid var(--yuzey-2); border-bottom: 0; }
.igne .levha { background: var(--yuzey-2); color: var(--murekkep); box-shadow: 0 0 0 1px var(--cizgi-koyu), 0 2px 6px rgb(0 0 0 / .28); }
.igne.secili .levha { background: var(--secim); color: var(--secim-ustu); transform: scale(1.2); box-shadow: 0 0 0 2px var(--yuzey-2), 0 3px 10px rgb(0 0 0 / .35); }
.igne:focus-visible { outline: 0; }
.igne:focus-visible .levha { box-shadow: 0 0 0 2px var(--yuzey-2), 0 0 0 5px var(--vurgu); }
.koor-nokta { width: 12px; height: 12px; border: 2px solid var(--yuzey-2); border-radius: 50%; background: var(--secim); box-shadow: 0 0 0 1px var(--secim-ustu); }

.perde { display: none; }

/* ---------- sekmeler: Harita | Keşfet (geniş ekranda üstte, telefonda altta) ---------- */
.sekmeler { display: flex; gap: 2px; padding: 3px; border: 0; border-radius: 12px; background: var(--vurgu-soluk); }
.sekme { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 6px 14px; border: 0; border-radius: 8px; background: none; color: var(--soluk); font: 600 15px/1 var(--yazi-dar); cursor: pointer; }
.sekme:hover { color: var(--murekkep); }
.sekme[aria-current="page"] { background: var(--yuzey-2); color: var(--murekkep); box-shadow: 0 1px 2px rgb(0 0 0 / .1); }
.sekme .simge { width: 16px; height: 16px; }
.sekmeler-alt { display: none; }
.gorunum-dugme { margin-left: auto; padding: 8px 11px; }
.gorunum-dugme .simge { width: 18px; height: 18px; stroke-width: 1.8; }
.ara-dugme { margin-left: 0; }
.ara-dugme .simge { width: 16px; height: 16px; stroke-width: 2; }
.uyg.kesfette { grid-template-areas: "ust ust ust" "panel kesfet kesfet"; }
.uyg.kesfette .sonuclar, .uyg.kesfette .harita-kap { display: none; }

/* ---------- keşfet ---------- */
.kesfet { grid-area: kesfet; min-height: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--zemin); }
.kesfet-ic { width: min(760px, 100%); margin: 0 auto; padding: 18px 16px 32px; display: flex; flex-direction: column; gap: 24px; }
.arama { position: relative; display: flex; align-items: center; }
.arama > .simge { position: absolute; left: 14px; width: 18px; height: 18px; color: var(--soluk); stroke-width: 2; pointer-events: none; }
.arama-giris { width: 100%; min-height: 48px; padding: 10px 14px 10px 42px; border: 1px solid var(--cizgi-koyu); border-radius: 12px; background: var(--yuzey-2); color: var(--murekkep); font: 500 16px/1.2 var(--yazi); }
.arama-giris::placeholder { color: var(--soluk); opacity: 1; }
.kapsam { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 10px 14px; border: 1px solid var(--cizgi); border-radius: 12px; background: var(--yuzey); }
.kapsam p { flex: 1; min-width: 0; margin: 0; font: 500 15.5px/1.3 var(--yazi-dar); overflow-wrap: anywhere; }
.kapsam .baslik-kucuk { display: block; margin-bottom: 3px; }
.raflar { display: flex; flex-direction: column; gap: 24px; }
.raf { display: flex; flex-direction: column; gap: 8px; }
.raf-baslik { margin: 0; font: 700 22px/1.1 var(--yazi-dar); }
.raf-not { margin: -4px 0 2px; color: var(--soluk); font-size: 13.5px; }
.satirlar { list-style: none; margin: 0; padding: 0; border: 1px solid var(--cizgi); border-radius: 12px; background: var(--yuzey-2); overflow: hidden; }
.satir { position: relative; border-bottom: 1px solid var(--cizgi); }
.satir:last-child { border-bottom: 0; }
.satir-ac { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 10px 52px 10px 14px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.satir-ac:hover { background: var(--vurgu-soluk); }
.satir-ac:focus-visible { outline-offset: -2px; }
.satir .favori { top: 50%; right: 6px; transform: translateY(-50%); }
.satir-sol { width: 30px; height: 30px; border-radius: 10px; font-size: 17px; }
.satir-sol.harf { background: var(--yuzey-2); color: var(--vurgu); box-shadow: inset 0 0 0 1.5px var(--vurgu-dolgu); }
.satir-sol.oneri { background: var(--secim); color: var(--secim-ustu); }
.satir-govde { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.satir-ad { font: 600 16.5px/1.2 var(--yazi-dar); overflow-wrap: anywhere; }
.satir-alt { color: var(--soluk); font-size: 13.5px; line-height: 1.3; overflow-wrap: anywhere; }
.satir-alt .uzaklik { margin-right: 4px; }
.olcu { display: inline-flex; align-items: center; gap: 4px; color: var(--soluk); font: 600 14px/1 var(--yazi-dar); font-variant-numeric: tabular-nums; white-space: nowrap; }
.olcu .simge { width: 14px; height: 14px; }
.olcu.fav { color: var(--uyari); }
.olcu.fav .simge path { fill: var(--secim); }
.raf-bos { margin: 0; padding: 16px; border: 1px dashed var(--cizgi-koyu); border-radius: 12px; color: var(--soluk); }
.raf-daha { align-self: flex-start; }
.arama-ozet { margin: 0; color: var(--soluk); font: 500 14px/1.3 var(--yazi-dar); }

/* ---------- haritada "Bu alanı tara" ---------- */
.tara-dugme { position: absolute; z-index: 2; top: 12px; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 8px 16px; border: 1px solid var(--cizgi-koyu); border-radius: 19px; background: var(--yuzey-2); color: var(--vurgu); box-shadow: var(--golge); font: 700 15px/1 var(--yazi-dar); white-space: nowrap; cursor: pointer; }
.tara-dugme:hover { border-color: var(--vurgu); }
.harita-not:not([hidden]) ~ .tara-dugme { top: 48px; }
.tara-dugme .simge { width: 15px; height: 15px; stroke-width: 2.2; }
/* ---------- işletme sayfası ---------- */
/* Telefonda tam ekran; geniş ekranda filtre paneli ve listenin yerini alır, harita yanında açık kalır. */
.uyg.sayfada { grid-template-areas: "ust ust ust" "sayfa sayfa harita"; }
.uyg.sayfada .panel, .uyg.sayfada .sonuclar, .uyg.sayfada .kesfet { display: none; }
.mekan-sayfa { grid-area: sayfa; min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; background: var(--zemin); border-right: 1px solid var(--cizgi); }
.ms-ust { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 4px; min-height: 52px; padding: 6px 8px; background: var(--yuzey); border-bottom: 1px solid var(--cizgi); }
.ms-geri { display: grid; place-items: center; flex: none; width: 40px; height: 40px; border: 0; border-radius: 12px; background: none; color: var(--murekkep); cursor: pointer; }
.ms-geri:hover { background: var(--vurgu-soluk); }
.ms-geri .simge { width: 20px; height: 20px; stroke-width: 2; }
.ms-ust-ad { flex: 1; min-width: 0; margin: 0; font: 600 16px/1.2 var(--yazi-dar); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-eylem { display: flex; flex: none; gap: 2px; }
.ms-eylem .favori { position: static; }
.ms-govde { width: min(720px, 100%); margin: 0 auto; padding: 20px 16px 36px; display: flex; flex-direction: column; gap: 16px; }
.ms-bas { display: flex; flex-direction: column; gap: 8px; }
.ms-tur { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--soluk); font: 600 13px/1.2 var(--yazi-dar); letter-spacing: .05em; text-transform: uppercase; }
.ms-tur .levha { width: 26px; height: 26px; border-radius: 10px; font-size: 15px; letter-spacing: 0; text-transform: none; }
.ms-ad { margin: 0; font: 700 29px/1.1 var(--yazi-dar); text-wrap: balance; overflow-wrap: anywhere; }
.ms-ad:focus { outline: none; }
.ms-yer { margin: 0; color: var(--soluk); font-size: 14.5px; line-height: 1.4; }
.ms-hizli { display: flex; gap: 8px; }
.ms-hizli > * { flex: 1 1 0; min-width: 0; }
.ms-hizli-dugme { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 66px; padding: 10px 4px; border: 1px solid var(--cizgi-koyu); border-radius: 14px; background: var(--yuzey-2); color: var(--vurgu); font: 600 14px/1.1 var(--yazi-dar); text-align: center; text-decoration: none; cursor: pointer; }
.ms-hizli-dugme:hover { border-color: var(--vurgu); }
.ms-hizli-dugme .simge { width: 20px; height: 20px; stroke-width: 1.8; }
.ms-bolum { display: flex; flex-direction: column; gap: 10px; padding: 16px; border: 1px solid var(--cizgi); border-radius: 14px; background: var(--yuzey-2); }
.ms-bolum-bas { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; }
.ms-bolum h3 { margin: 0; font: 700 19px/1.2 var(--yazi-dar); }
.ms-etiket { padding: 2px 7px 1px; border-radius: 6px; background: var(--vurgu-soluk); color: var(--vurgu); font: 600 12px/1.4 var(--yazi-dar); white-space: nowrap; }
.ms-etiket.beyan { background: var(--secim); color: var(--secim-ustu); }
.ms-bos { margin: 0; padding: 14px; border: 1px dashed var(--cizgi-koyu); border-radius: 12px; color: var(--soluk); }
.ms-bos p { margin: 0; }
.ms-bos p + p { margin-top: 6px; font-size: 13.5px; }
.ms-aciklama { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.ms-kutular { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.ms-kutu { padding: 12px; border: 1px solid var(--cizgi); border-radius: 12px; background: var(--yuzey); }
.ms-kutu h4 { margin: 0 0 4px; color: var(--soluk); font: 600 13px/1.2 var(--yazi-dar); letter-spacing: .04em; text-transform: uppercase; }
.ms-kutu p { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.ms-not { margin: 0; color: var(--soluk); font-size: 13px; }
.ms-satirlar { list-style: none; margin: 0; padding: 0; }
.ms-satir { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 12px; padding: 10px 0; border-bottom: 1px solid var(--cizgi); }
.ms-satir:first-child { padding-top: 2px; }
.ms-satir:last-child { padding-bottom: 2px; border-bottom: 0; }
.ms-satir-ad { font: 500 15px/1.3 var(--yazi); }
.ms-satir-deger { display: inline-flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 4px 6px; font: 600 15px/1.3 var(--yazi-dar); text-align: right; }
.ms-satir-deger .simge { width: 15px; height: 15px; }
.ms-satir.genis { grid-template-columns: minmax(0, 1fr); }
.ms-satir.genis .ms-satir-ad { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
.ms-cipler { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.ms-liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
.ms-liste li { padding: 2px 0; }
.ms-cipler li { padding: 5px 9px 4px; border: 1px solid var(--cizgi); border-radius: 10px; font: 500 14px/1.2 var(--yazi-dar); }
.ms-cipler li.aranan { border-color: var(--vurgu); background: var(--vurgu-soluk); font-weight: 600; }
.ms-cipler.uzun { max-height: 232px; overflow-y: auto; padding: 8px; border: 1px solid var(--cizgi); border-radius: 12px; }
.ms-iletisim { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 16px; margin: 0; font-size: 15px; }
.ms-iletisim dt { color: var(--soluk); font: 500 14px/1.45 var(--yazi-dar); }
.ms-iletisim dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.ms-iletisim a { color: var(--vurgu); text-underline-offset: 3px; }
.ms-kaynak { display: flex; flex-direction: column; gap: 4px; padding: 0 4px; color: var(--soluk); font-size: 13px; }
.ms-kaynak p { margin: 0; }
.ms-kaynak a { color: inherit; text-underline-offset: 2px; }
.ms-yakin .satirlar { border-radius: 12px; }

/* ---------- puanlar ---------- */
.sonuc-ust { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
.sonuc-ust .sonuc-sayi { flex: 1; }
.sirala { display: inline-flex; align-items: center; gap: 6px; color: var(--soluk); font: 500 13px/1.2 var(--yazi-dar); }
.sirala-sec { min-height: 34px; padding: 4px 8px; border: 1px solid var(--cizgi-koyu); border-radius: 10px; background: var(--yuzey-2); color: var(--murekkep); font: 500 14px/1.2 var(--yazi); }
.arama-ust { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
.arama-ust .arama-ozet { flex: 1; }
.puan-cip { color: var(--uyari); font-weight: 600; }
.puan-cip .simge path, .satir-puan .simge path, .ms-puan-ozet .simge path, .yildizlar .dolu path, .puan-dugme.dolu .simge path, .ms-dagilim-y .simge path { fill: var(--secim); }
.puan-cip .simge, .satir-puan .simge { stroke: var(--uyari); }
.puan-sayi { color: var(--soluk); font-weight: 500; }
.satir-puan { display: inline-flex; align-items: center; gap: 3px; color: var(--uyari); font-weight: 600; }
.satir-puan .simge { width: 12px; height: 12px; }
.olcu-ek { color: var(--soluk); font-weight: 500; }
.ms-puan-ozet { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--soluk); font: 500 15px/1.2 var(--yazi-dar); }
.ms-puan-ozet strong { color: var(--murekkep); font-weight: 700; }
.ms-puan-ozet .simge { width: 16px; height: 16px; stroke: var(--uyari); }
.ms-puan { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px 24px; }
.ms-puan-sol { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 96px; }
.ms-puan-sayi { font: 700 40px/1 var(--yazi-dar); font-variant-numeric: tabular-nums; }
.ms-puan-adet { color: var(--soluk); font: 500 13.5px/1.2 var(--yazi-dar); }
.yildizlar { display: inline-flex; gap: 1px; }
.yildizlar .simge { width: 15px; height: 15px; stroke: var(--uyari); stroke-width: 1.4; }
.yildizlar .simge:not(.dolu) { stroke: var(--cizgi-koyu); }

.ms-dagilim li { display: grid; grid-template-columns: 30px minmax(0, 1fr) 32px; align-items: center; gap: 8px; font: 500 13px/1.2 var(--yazi-dar); }

.ms-dagilim-y .simge { width: 11px; height: 11px; stroke: var(--uyari); }
.ms-dagilim-cubuk { height: 8px; border-radius: 6px; background: var(--zemin); overflow: hidden; }
.ms-dagilim-cubuk span { display: block; height: 100%; border-radius: 6px; background: var(--secim); }
.ms-dagilim-n { color: var(--soluk); text-align: right; font-variant-numeric: tabular-nums; }
.ms-puan-ver { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding-top: 10px; border-top: 1px solid var(--cizgi); }
.ms-puan-ver-etiket { font: 600 15px/1.2 var(--yazi-dar); }
.puan-dugmeler { display: flex; gap: 2px; }
.puan-dugme { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 12px; background: none; color: var(--cizgi-koyu); cursor: pointer; }

.puan-dugme.dolu { color: var(--uyari); }
@media (hover: hover) {
  .puan-dugmeler:hover .puan-dugme .simge path { fill: var(--secim); }
  .puan-dugmeler:hover .puan-dugme { color: var(--uyari); }

  .puan-dugmeler .puan-dugme:hover ~ .puan-dugme { color: var(--cizgi-koyu); }
}

/* ---------- fotoğraflar ---------- */
.ms-fotolar { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }

.ms-foto img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; transition: transform .2s; }

.ms-foto:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; }
.foto-kutusu { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; margin: 0; padding: 0; border: 0; background: rgb(8 12 14 / .94); color: #fff; }
.foto-kutusu::backdrop { background: rgb(0 0 0 / .6); }
.fk-ic { position: relative; display: grid; place-items: center; width: 100%; height: 100%; padding: 56px 12px 48px; }
.fk-resim { display: block; max-width: calc(100vw - 24px); max-height: calc(100dvh - 112px); width: auto; height: auto; object-fit: contain; border-radius: 6px; }
.fk-dugme { position: absolute; display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: rgb(255 255 255 / .14); color: #fff; cursor: pointer; }
.fk-dugme:hover { background: rgb(255 255 255 / .26); }
.fk-dugme:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.fk-dugme .simge { width: 20px; height: 20px; stroke-width: 2; }
.fk-kapat { top: 8px; right: 8px; }
.fk-onceki { left: 8px; top: 50%; transform: translateY(-50%); }
.fk-sonraki { right: 8px; top: 50%; transform: translateY(-50%); }
.fk-sonraki .simge { transform: scaleX(-1); }
.fk-yazi { position: absolute; left: 0; right: 0; bottom: 12px; margin: 0; text-align: center; font: 500 14px/1.2 var(--yazi-dar); color: rgb(255 255 255 / .85); }

.tara-alan { fill: var(--vurgu-dolgu); fill-opacity: .05; stroke: var(--vurgu-dolgu); stroke-opacity: .8; stroke-width: 2; stroke-dasharray: 6 5; }

/* ---------- dar ekran: panel çekmece olur ---------- */
@media (max-width: 1099.98px) {
  .uyg { grid-template-columns: 360px minmax(0, 1fr); grid-template-areas: "ust ust" "sonuc harita"; }
  .uyg.kesfette { grid-template-areas: "ust ust" "kesfet kesfet"; }
  .uyg.sayfada { grid-template-areas: "ust ust" "sayfa harita"; }
  .dugme-filtre { display: inline-flex; }
  .panel { position: fixed; z-index: 30; inset: 0 auto 0 0; width: min(380px, 100%); padding-top: env(safe-area-inset-top, 0px); box-shadow: var(--golge); transform: translateX(-104%); visibility: hidden; transition: transform .2s ease, visibility 0s linear .2s; }
  .panel.acik { transform: none; visibility: visible; transition: transform .2s ease; }
  .kapat { display: inline-grid; place-items: center; }
  .panel-alt { display: block; }
  .perde { display: block; position: fixed; z-index: 20; inset: 0; background: var(--perde); }
}
/* ---------- telefon: harita üstte, liste altta ---------- */
@media (max-width: 719.98px) {
  .uyg { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(200px, 42%) minmax(0, 1fr) auto; grid-template-areas: "ust" "harita" "sonuc" "sekme"; }
  .uyg.kesfette { grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "ust" "kesfet" "sekme"; }
  .uyg.sayfada { grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "sayfa" "sekme"; }
  .uyg.sayfada .ust, .uyg.sayfada .harita-kap { display: none; }
  .mekan-sayfa { border-right: 0; }
  .ms-govde { padding: 16px 12px 28px; gap: 14px; }
  .ms-ad { font-size: 25px; }
  .ms-hizli { gap: 6px; }
  .ms-bolum { padding: 14px; }
  .ust { gap: 8px; padding: 8px 12px; }
  .sekmeler-ust { display: none; }
  .ara-dugme { padding: 8px 11px; }
  .ara-dugme .ara-metin { display: none; }
  .sekmeler-alt { grid-area: sekme; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--cizgi); background: var(--yuzey); }
  .sekmeler-alt .sekme { flex-direction: column; gap: 3px; min-height: 56px; border-radius: 0; font-size: 13.5px; }
  .sekmeler-alt .sekme .simge { width: 22px; height: 22px; stroke-width: 1.6; }
  .sekmeler-alt .sekme[aria-current="page"] { background: none; color: var(--vurgu); }
  .kesfet-ic { padding: 14px 12px 24px; gap: 22px; }
  .raf-baslik { font-size: 20px; }
  .panel { width: 100%; }
  .sonuclar { border-right: 0; border-top: 1px solid var(--cizgi); }
  .sonuc-sayi { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) {
  .uyg *, .uyg *::before, .uyg *::after { transition: none !important; animation: none !important; }
}
</style>

<script>
(() => {

  const MEKAN_ALANLARI = 'id,kategori,ad,lat,lng,adres,il,ilce,telefon,web,ozellikler,dogrulanacak,dogrulama_tarihi,osm_ref,onem';

  // Veritabanı tek yanıtta en fazla 1000 satır döndürür; listeler sayfa sayfa okunur.
  // Toplam, "Content-Range: 0-999/1234" başlığından alınır; başlık yoksa eksik sayfa gelince durulur.
  const SAYFA_BOYU = 1000;
  async function sayfaliGetir(iste, ad) {
    const tum = [];
    for (let atla = 0; ; ) {
      const y = await iste(atla);
      if (!y.ok) throw new Error(`${ad}: ${y.status} ${await y.text().catch(() => '')}`);
      const sayfa = await y.json();
      if (!Array.isArray(sayfa)) throw new Error(`${ad}: yanıt liste değil`);

      atla += sayfa.length;
      const t = /\/(\d+)$/.exec(y.headers.get('content-range') || '');
      if (!sayfa.length || (t ? atla >= Number(t[1]) : sayfa.length < SAYFA_BOYU)) return tum;
      if (tum.length > 200000) throw new Error(`${ad}: beklenmedik kadar çok satır`);
    }
  }

    .filter(m => m && m.id && m.ad && m.kategori && m.il && m.ilce && m.ozellikler)

  // Herkese açık anahtar yalnızca "apikey" başlığında gider; okuma izni veritabanındaki kurallarla sınırlı.
  function mekanSorgusu(kosul, ms) {
    const { url, anahtar } = AYAR.veritabani;
    const iptal = new AbortController();
    const sayac = setTimeout(() => iptal.abort(), ms);
    const iste = (atla, limit = SAYFA_BOYU) => fetch(`${url}/rest/v1/mekan?select=${MEKAN_ALANLARI}&durum=eq.acik${kosul}&order=id&limit=${limit}&offset=${atla}`, {
      headers: { apikey: anahtar, Accept: 'application/json', Prefer: 'count=exact' }, signal: iptal.signal,

    return { iste, iptal, bitir: () => clearTimeout(sayac) };
  }

  async function mekanlariVeritabanindanGetir(ms, kucukler) {
    if (!kucukler.length) return [];
    const s = mekanSorgusu(`&kategori=in.(${kucukler.join(',')})`, ms);

  async function hepsiniGetir(kosul, ms, ust) {
    const s = mekanSorgusu(kosul, ms);

      const y = await s.iste(0);
      if (!y.ok) throw new Error(`mekan: ${y.status} ${await y.text().catch(() => '')}`);

          if (!yy.ok) throw new Error(`mekan: ${yy.status}`);

      if (ust && toplam > ust) return { toplam, satirlar: null };
      const kalan = [];
      for (let atla = ilk.length; ilk.length && atla < toplam; atla += SAYFA_BOYU) kalan.push(atla);

          if (!yy.ok) throw new Error(`mekan: ${yy.status}`);

  function tumuAlani() {

  function favoriKaydet() { try { localStorage.setItem(FAVORI_ANAHTAR, JSON.stringify([...favoriler])); } catch (e) { /* bellekte kalır */ } }

  /* ---------- favori sayımı ve eklenme tarihi (veritabanı) ---------- */

  // Sıralama: 'puan' (ağırlıklı puan; puanı olmayanlar sonda) | 'yakinlik' (konum açıkken) | 'ad'. 'eslesme' yalnızca aramada.

  function siralamaSecimi(id, deger, secenekler, degisince) {

  /* ---------- listeler ---------- */

  const LISTE_ANAHTAR = 'kesif.listeler', AD_SINIRI = 60, KIMLIK_KALIBI = /^[a-z0-9]+(-[a-z0-9]+)*$/;
  let listeler = [];   // { id, ad, mekanlar: [mekan kimliği] }

  function listeKaydet() { try { localStorage.setItem(LISTE_ANAHTAR, JSON.stringify(listeler)); } catch (e) { /* bellekte kalır */ } }
  const adDuzelt = ad => ad.replace(/\s+/g, ' ').trim().slice(0, AD_SINIRI);

    const l = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ad: a, mekanlar: [...new Set(mekanIdleri || [])] };
    listeler.push(l); listeKaydet();

  }
  const seciliListe = () => (durum.gorunum.startsWith('l:') ? listeler.find(l => l.id === durum.gorunum.slice(2)) : null);
  function gorunumKumesi(g = durum.gorunum) {
    if (g === 'favori') return favoriler;
    if (g === 'paylasilan') return paylasilan ? new Set(paylasilan.idler) : null;
    if (g.startsWith('l:')) { const l = listeler.find(x => x.id === g.slice(2)); return l ? new Set(l.mekanlar) : null; }

  function gorunumAdi() {

  const kumedekiler = kume => mekanlar.filter(m => kume.has(m.id));
  // Bir kümenin (liste) kayıtlarını il ve kategoriye göre sayar; en kalabalık grup başta.
  function gruplar(kume) {

  }
  // İlçe seçimi: seçili il ve kategoride kaydı olan ilçeler, yanında kayıt sayısı. Seçili ilçe listede yoksa "Tüm ilçeler"e dönülür.
  function ilceleriCiz() {

      for (const m of mekanlar) if (m.il === durum.il && kategoriler[m.kategori] && !bolgeselMi(m.kategori)) ekle(m.ilce, 1);
    } else if (bolgeselMi(durum.kategori)) say = ilceSayilari(durum.kategori, durum.il);   // büyük kategori: veritabanındaki sayılar
    else for (const m of mekanlar) if (m.il === durum.il && m.kategori === durum.kategori) say.set(m.ilce, (say.get(m.ilce) || 0) + 1);

  function grubaGit(il, kategori, ciz) {

  // Favoriler ya da bir liste gösterilirken bölge, kategori ve filtreler uygulanmaz: listedeki her kayıt görünür.
  function gorunumeGec(g, ciz) {

  function gorunumuYaz() {
    if (durum.gorunum.startsWith('l:') && !seciliListe()) durum.gorunum = '';

  function listeDugmesi(m) {

  /* ---------- liste pencereleri ---------- */
  function diyalogAc(baslik, ...govde) {

  function yeniListeFormu(dugmeMetni, olusunca) {

  function listeEkleDiyalogu(m) {

      listeler.length ? el('ul', { class: 'liste-satirlari' }, satirlar) : el('p', { class: 'ipucu', text: 'Henüz listen yok. Aşağıdan bir ad verip ilk listeni oluştur.' }),

      el('p', { class: 'ipucu', text: 'Listelerin yalnızca bu cihazda, bu tarayıcıda saklanır.' }));
  }
  const b64 = { yaz: s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
    oku: s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))) };
  function paylasimBaglantisi(ad, idler) {
    const gecerli = idler.filter(id => mekanlar.some(m => m.id === id));
    return `${location.href.split('#')[0]}#liste=${b64.yaz(JSON.stringify({ v: 1, a: ad, m: gecerli }))}`;
  }
  function paylasimiOku() {
    const h = location.hash;
    if (!h.startsWith('#liste=')) return null;

      const v = JSON.parse(b64.oku(h.slice(7)));
      if (!v || typeof v.a !== 'string' || !Array.isArray(v.m)) return null;

  const filtreler = (kat = durum.kategori) => kategoriler[kat].filtreler;

  // Biçim: { alan, etiket, tip: 'metin' | 'sayi' | 'liste', birim?, kartta?, aranir? }. Bilinmeyen bilgi gösterilmez.
  // Her kategoride ortak: OSM/Overture'dan gelen ek bilgiler. Kategori kendi tanımında aynı alanı tanımlıyorsa onunki geçerlidir.
  const ORTAK_BILGILER = [
    { alan: 'calisma_saatleri', etiket: 'Çalışma saatleri', tip: 'metin' },
    { alan: 'marka', etiket: 'Marka', tip: 'metin', aranir: true },

  // Evet/hayır özellikleri: yalnızca biliniyorsa gösterilir (çoğu kayıtta bilinmiyor; "bilinmiyor" diye listelenmez).

  const bilgiler = kat => {

  const sayiBicim = new Intl.NumberFormat('tr-TR');
  function bilgiYaz(b, v) {

  }
  // "Bu alanı tara" seçiliyse ilçe yerine haritadaki alan geçerlidir: alanın içinde konumu olan kayıtlar (seçili ilde).
  const alanda = m => !!(m.konum && durum.alan && durum.alan.contains([m.konum.lat, m.konum.lng]));
  // Büyük kategoride bölge henüz yüklenmediyse (ya da il geneli seçiliyse) boş döner: eksik bir liste gösterilmez.
  const bolgeMekanlari = () => (bolgeHazirla().durum !== 'tamam' ? [] : tumuMu() ? tumuGorunenler().sort((a, b) => a.ad.localeCompare(b.ad, TR)) : mekanlar
    .filter(m => m.kategori === durum.kategori && m.il === durum.il && (durum.alan ? alanda(m) : (durum.ilce === TUM || m.ilce === durum.ilce)))

  const aktifMi = (f, s) => f.tip === 'coklu' ? !!(s && s.size) : s != null && s !== false;

  /* ---------- eşleşme: uyar / uymaz / belirsiz ---------- */

  function degerlendir(mekan, secimler) {

    for (const f of filtreler()) {

  }

  /* ---------- filtre paneli: kategori tanımından çizilir ---------- */
  let girdiler = [];   // { alan, deger, giris, kutu, adet }
  function filtreleriCiz() {

          giris.addEventListener('change', () => { durum.secimler[f.alan] = o.deger; guncelle(); });
          const kutu = el('label', { class: 'hap' }, giris, el('span', { class: 'hap-yuz' }, o.etiket, adet));
          girdiler.push({ f, deger: o.deger, giris, kutu, adet });
          return kutu;
        });
        kap.append(el('div', { class: 'grup', role: 'radiogroup', 'aria-labelledby': bid },
          el('h3', { class: 'baslik-kucuk', id: bid, text: f.etiket }), el('div', { class: 'haplar' }, haplar)));
      } else if (f.tip === 'evet_hayir') {
        const adet = el('span', { class: 'adet' });
        const giris = el('input', { type: 'checkbox', role: 'switch', class: 'anahtar-giris', id: `f-${f.alan}` });
        giris.addEventListener('change', () => { durum.secimler[f.alan] = giris.checked ? true : null; guncelle(); });
        const kutu = el('div', { class: 'grup anahtar' }, el('label', { for: giris.id, text: f.etiket }), adet, giris);
        girdiler.push({ f, deger: true, giris, kutu, adet });
        kap.append(kutu);
      } else if (f.tip === 'coklu') {
        const ogeler = f.secenekler.map(o => {
          const adet = el('span', { class: 'adet' });
          const giris = el('input', { type: 'checkbox', id: `f-${f.alan}-${o.deger}` });
          giris.addEventListener('change', () => {
            const s = durum.secimler[f.alan] || (durum.secimler[f.alan] = new Set());
            if (giris.checked) s.add(o.deger); else s.delete(o.deger);
            guncelle();
          });
          const kutu = el('li', { class: 'cok-oge' }, el('label', null, giris, el('span', { class: 'cok-ad', text: o.etiket }), adet));
          girdiler.push({ f, deger: o.deger, giris, kutu, adet });
          return { kutu, giris, one: !!o.one_cikan, anahtar: duz(o.etiket) };
        });
        // Uzun listede (ör. mağazalar) arama yazılmadıkça yalnızca öne çıkanlar ve seçili olanlar görünür.
        const uzun = f.secenekler.length > 40;
        const seciliSayi = el('span', { class: 'secili-sayi', id: `ss-${f.alan}` });
        const yok = el('p', { class: 'ipucu', text: 'Bu adla bir seçenek yok.', hidden: true });
        let ara = null;
        if (f.secenekler.length > 8) {
          ara = el('input', { type: 'search', class: 'ara', id: `ara-${f.alan}`, placeholder: `${f.etiket} içinde ara`, 'aria-label': `${f.etiket} içinde ara`, autocomplete: 'off' });
          const suz = () => {
            const q = duz(ara.value);
            let gorunen = 0;
            for (const o of ogeler) { const g = q ? o.anahtar.includes(q) : (!uzun || o.one || o.giris.checked); o.kutu.hidden = !g; if (g) gorunen++; }
            yok.hidden = gorunen > 0;
          };
          ara.addEventListener('input', suz);
          suz();
        }
        kap.append(el('div', { class: 'grup', role: 'group', 'aria-labelledby': bid },
          el('div', { class: 'grup-bas' }, el('h3', { class: 'baslik-kucuk', id: bid, text: f.etiket }), seciliSayi),
          el('p', { class: 'ipucu', text: f.eslesme === 'herhangi' ? 'Seçtiklerinden en az birini sunanlar gösterilir.' : 'Seçtiklerinin hepsini sunanlar gösterilir.' }),
          ara, uzun ? el('p', { class: 'ipucu', text: `${f.secenekler.length} seçenek var; en yaygın olanlar listeleniyor. Diğerleri için adını yaz.` }) : null,
          el('ul', { class: 'cok' }, ogeler.map(o => o.kutu)), yok));
      }
    }
  }

  // Girişleri duruma eşitler ve her seçeneğin yanına "bunu seçersem kaç sonuç kalır" sayısını yazar.
  function paneliEsle(tum) {
    const say = degistir => {
      const s = { ...durum.secimler };
      degistir(s);
      return tum.filter(m => degerlendir(m, s).sonuc === 'uyar').length;
    };
    for (const g of girdiler) {
      const { f } = g;
      const s = durum.secimler[f.alan];
      let n;
      if (f.tip === 'secim') { g.giris.checked = (s ?? null) === g.deger; n = say(x => { x[f.alan] = g.deger; }); }
      else if (f.tip === 'evet_hayir') { g.giris.checked = s === true; n = say(x => { x[f.alan] = true; }); }
      else { g.giris.checked = !!(s && s.has(g.deger)); n = say(x => { x[f.alan] = new Set(s || []).add(g.deger); }); }
      g.adet.textContent = n;
      g.kutu.classList.toggle('bos', n === 0 && !g.giris.checked);
    }
    for (const f of filtreler()) {
      if (f.tip !== 'coklu') continue;
      const n = (durum.secimler[f.alan] || new Set()).size;
      $(`#ss-${f.alan}`).textContent = n ? `${n} seçili` : '';
    }
  }

  function aktifler() {
    const a = [];
    if (durum.gorunum) a.push({ etiket: gorunumAdi(), kaldir: () => { durum.gorunum = ''; } });
    else if (durum.alan) a.push({ etiket: 'Haritadaki alan', kaldir: () => { durum.alan = null; } });
    for (const f of filtreler()) {
      const s = durum.secimler[f.alan];
      if (!aktifMi(f, s)) continue;
      if (f.tip === 'secim') a.push({ etiket: secenekEtiketi(f, s), kaldir: () => { durum.secimler[f.alan] = null; } });
      else if (f.tip === 'evet_hayir') a.push({ etiket: f.etiket, kaldir: () => { durum.secimler[f.alan] = null; } });
      else for (const d of f.secenekler.filter(o => s.has(o.deger))) a.push({ etiket: d.etiket, kaldir: () => { s.delete(d.deger); } });
    }
    return a;
  }

  /* ---------- sonuç listesi ---------- */
  function ozetOgeleri(m) {
    const ogeler = [];
    const p = puanOzeti(m);
    if (p && p.sayi) ogeler.push(el('li', { class: 'olgu puan-cip', title: `${p.sayi} puan, ortalama ${virgul(p.ort)}` },
      simge('yildiz'), el('span', { class: 'gorunmez', text: 'Puan: ' }), virgul(p.ort), el('span', { class: 'puan-sayi', text: ` (${p.sayi})` })));
    // Bilinmeyenler tek satırda toplanır (tek tek listesi ayrıntıda): kart kısa kalır, eksik bilgi yine görünür.
    const bilinmeyen = filtreler(m.kategori).filter(f => !f.seyrek && m.ozellikler[f.alan] == null);
    for (const f of filtreler(m.kategori)) {
      const v = m.ozellikler[f.alan];
      if (v == null) continue;
      else if (f.tip === 'secim') ogeler.push(el('li', { class: 'tip', text: secenekEtiketi(f, v) }));
      else if (f.tip === 'evet_hayir' && f.seyrek && !v) continue;   // seyrek özellikte kartta yalnızca "var" gösterilir
      else if (f.tip === 'evet_hayir') ogeler.push(el('li', { class: `olgu ${v ? 'var' : 'yok'}` }, simge(v ? 'var' : 'yok'), `${f.etiket} ${v ? 'var' : 'yok'}`));
      // Az seçenekli çoklu alan (ör. otopark işletmecisi) adlarıyla, uzun olan (ör. dersler) sayısıyla gösterilir.
      // Kayıtta en çok iki değer varsa da adları yazılır (ör. restoranın mutfağı, tarihi yerin türü).
      else if (f.tip === 'coklu' && (f.secenekler.length <= 3 || v.length <= 2)) for (const d of v) ogeler.push(el('li', { class: 'tip', text: secenekEtiketi(f, d) }));
      else if (f.tip === 'coklu') ogeler.push(el('li', { class: 'olgu', text: `${f.etiket}: ${v.length}` }));
    }
    for (const b of bilgiler(m.kategori)) {
      const y = b.kartta && b.tip !== 'liste' ? bilgiYaz(b, m.ozellikler[b.alan]) : null;
      if (y) ogeler.push(el('li', { class: 'olgu', title: b.etiket }, el('span', { class: 'gorunmez', text: `${b.etiket}: ` }), y));
    }
    if (bilinmeyen.length === 1) ogeler.push(el('li', { class: 'olgu bilinmiyor' }, simge('bilinmiyor'), `${bilinmeyen[0].etiket} bilinmiyor`));
    else if (bilinmeyen.length > 1) {
      ogeler.push(el('li', { class: 'olgu bilinmiyor', title: `Bilinmeyen: ${bilinmeyen.map(f => f.etiket).join(', ')}` },
        simge('bilinmiyor'), `${bilinmeyen.length} bilgi eksik`));
    }
    if (!m.konum) ogeler.push(el('li', { class: 'olgu yersiz' }, simge('yersiz'), 'Haritada yeri yok'));
    return ogeler;
  }

  // Kartta gösterilen tür: sınıflanmamış kayıtta (Diğer yerler) asıl türü (ör. "Banka"), diğerlerinde kategori adı.
  function turEtiketi(m) {
    const kat = kategoriler[m.kategori];
    const t = m.kategori === 'diger' && m.ozellikler && Array.isArray(m.ozellikler.tur) ? m.ozellikler.tur[0] : null;
    const f = t && kat.filtreler.find(x => x.alan === 'tur');
    const s = f && f.secenekler.find(o => o.deger === t);
    return s ? s.etiket : kat.ad;
  }

  // Kaynakta adres yoksa adres konumdan üretilir (en yakın mahalle ve sokak); dogrulanacak listesinde 'adres_yaklasik' işareti taşır.
  const adresYaklasik = m => (m.dogrulanacak || []).includes('adres_yaklasik');

  function kart(m, eksik) {
    const uzak = konum.son && m.konum ? uzaklik(konum.son, m.konum) : null;
    const bas = el('button', { class: 'kart-bas', type: 'button', 'aria-label': `${m.ad}: işletme sayfasını aç` },
      durum.gorunum || tumuMu() ? el('span', { class: 'kart-tur', text: turEtiketi(m) }) : null,
      el('span', { class: 'kart-ad', text: m.ad }),
      el('span', { class: 'kart-adres' },
        uzak != null ? el('span', { class: 'uzaklik', title: 'Kuş uçuşu uzaklık' }, el('span', { class: 'gorunmez', text: 'Uzaklık: ' }), uzaklikYaz(uzak)) : null,
        adresYaklasik(m) ? el('span', { class: 'yaklasik', title: 'Konumdan üretilen yaklaşık adres', text: 'Yaklaşık: ' }) : null,
        m.adres));
    bas.addEventListener('click', () => mekanSayfasiniAc(m, { kaynak: 'liste' }));
    return el('li', { class: 'kart', 'data-id': m.id },
      bas, favoriDugmesi(m), listeDugmesi(m),
      el('ul', { class: 'ozet' }, ozetOgeleri(m)),
      eksik && eksik.length ? el('p', { class: 'neden', text: `Bilinmeyen: ${eksik.map(f => f.etiket).join(', ')}` }) : null);
  }

  function listeyiCiz(tum, uyan, belirsiz) {
    const aktif = aktifler();
    const bb = bolgeBilgi;
    $('#sonucSayi').textContent = bb.durum === 'yukleniyor' ? 'Yükleniyor…'
      : bb.durum === 'secim' ? `${sayiBicim.format(bb.toplam || 0)} kayıt` : `${uyan.length} sonuç`;
    const notlar = [];
    if (aktif.length && !durum.gorunum) notlar.push(`${tum.length} kayıt içinden`);
    if (durum.gorunum && tum.length) notlar.push('bütün kategoriler ve şehirler');
    // "Tümü": haritadaki alanda gösterilen kayıt sayısı yakınlığa göre sınırlı; sınıra varıldıysa söylenir.
    if (tumuMu() && !durum.gorunum && harita && bb.durum !== 'yukleniyor') {
      const sinir = tumuSiniri(Math.round(harita.getZoom()));
      notlar.push(uyan.length >= sinir
        ? `Haritadaki alanda öne çıkan ${sayiBicim.format(sinir)} yer gösteriliyor; yakınlaştıkça daha fazlası görünür. Bir kategori seçersen o kategorinin bütün kayıtları listelenir.`
        : 'Haritadaki alanda bulunan yerler');
    }
    const yersiz = uyan.filter(m => !m.konum).length;
    if (yersiz) notlar.push(`${yersiz} sonucun haritada yeri henüz yok`);
    if (durum.siralama === 'yakinlik' && !konum.son && uyan.length > 1) notlar.push(konum.aktif ? 'yakınlık için konumun bekleniyor' : 'yakınlığa göre sıralamak için konumunu aç');
    const not = $('#sonucNot');
    not.textContent = notlar.join(' · ');
    not.hidden = !notlar.length;

    paylasilaniYaz();

    const cipler = $('#cipler');
    cipler.replaceChildren(...aktif.map(a => {
      const kaldir = el('button', { type: 'button', 'aria-label': `${a.etiket} filtresini kaldır` }, simge('yok'));
      kaldir.addEventListener('click', () => { a.kaldir(); guncelle(); });
      return el('li', { class: 'cip' }, el('span', { class: 'cip-ad', text: a.etiket }), kaldir);
    }));
    cipler.hidden = !aktif.length;
    $('#temizle').hidden = !aktif.length;
    const rozet = $('#filtreSayisi');
    rozet.textContent = aktif.length;
    rozet.hidden = !aktif.length;
    $('#panelUygula').textContent = durum.sekme === 'kesfet' ? 'Keşfet\'e dön' : uyan.length ? `${uyan.length} sonucu göster` : 'Listeye dön';

    const liste = $('#liste');
    if (uyan.length) liste.replaceChildren(...uyan.map(m => kart(m)));
    else if (!tum.length && durum.gorunum) {
      const hepsi = el('button', { class: 'dugme', type: 'button', text: 'Tüm kayıtları göster' });
      hepsi.addEventListener('click', () => { durum.gorunum = ''; guncelle(); });
      const favori = durum.gorunum === 'favori';
      liste.replaceChildren(el('li', { class: 'bos-durum' },
        el('p', { text: favori ? 'Henüz favorin yok.' : 'Bu listede henüz kayıt yok.' }),
        el('p', { text: favori ? `Bir kaydı favoriye almak için kartındaki yıldıza bas. ${FAVORI_NOTU}`
          : 'Bir kaydı listeye eklemek için kartındaki liste düğmesine bas.' }), hepsi));
    } else if (bb.durum !== 'tamam') {
      liste.replaceChildren(bolgeDurumKutusu(bb));
    } else if (!tum.length && durum.alan) {
      const kaldir = el('button', { class: 'dugme', type: 'button', text: 'Alan seçimini kaldır' });
      kaldir.addEventListener('click', () => { durum.alan = null; guncelle(); });
      liste.replaceChildren(el('li', { class: 'bos-durum' },
        el('p', { text: `Haritadaki bu alanda kayıt yok (${kategoriler[durum.kategori].ad}).` }),
        el('p', { text: 'Haritayı kaydırıp yeniden tarayabilir ya da alan seçimini kaldırabilirsin.' }), kaldir));
    } else if (!tum.length) {
      liste.replaceChildren(el('li', { class: 'bos-durum' },
        el('p', { text: `${bolgeAdi()} için bu kategoride henüz kayıt yok.` }),
        el('p', { text: 'Başka bir bölge ya da kategori seçebilirsin.' })));
    } else {
      const temizle = el('button', { class: 'dugme', type: 'button', text: 'Filtreleri temizle' });
      temizle.addEventListener('click', filtreleriTemizle);
      liste.replaceChildren(el('li', { class: 'bos-durum' },
        el('p', { text: belirsiz.length ? 'Bu filtrelere kesin olarak uyan sonuç yok. Bilgisi eksik kayıtlar aşağıda.' : 'Bu filtrelere uyan sonuç yok.' }), temizle));
    }
    $('#belirsiz').hidden = !belirsiz.length;
    $('#belirsizBaslik').textContent = `Bilgisi eksik: ${belirsiz.length} kayıt`;
    $('#belirsizListe').replaceChildren(...belirsiz.map(b => kart(b.m, b.eksik)));
  }

  // Büyük kategoride liste yerine gösterilen açıklama: il geneli seçimi, yükleniyor, hata, alan çok geniş.
  function bolgeDurumKutusu(bb) {
    const kat = kategoriler[durum.kategori];
    const kutu = el('li', { class: 'bos-durum' });
    if (bb.durum === 'secim') {
      const say = ilceSayilari(durum.kategori, durum.il);
      const enCok = [...say].sort((a, b) => b[1] - a[1]).slice(0, 8);
      const sec = ilce => { durum.ilce = ilce; durum.secili = null; durum.alan = null; ilceleriCiz(); baglamiYaz(); bolgeyiCiz(); guncelle(); };
      const dugmeler = enCok.map(([ilce, n]) => {
        const b = el('button', { class: 'dugme ilce-dugme', type: 'button', text: `${ilce} (${sayiBicim.format(n)})` });
        b.addEventListener('click', () => sec(ilce));
        return b;
      });
      const yer = konum.son && yerBul(konum.son.lat, konum.son.lng);
      if (yer && yer.il === durum.il && yer.ilce && say.has(yer.ilce)) {
        const b = el('button', { class: 'dugme', type: 'button', text: `Bulunduğun ilçe: ${yer.ilce}` });
        b.addEventListener('click', () => sec(yer.ilce));
        dugmeler.unshift(b);
      }
      kutu.append(
        el('p', { text: bb.toplam ? `${durum.il} genelinde ${kat.ad.toLocaleLowerCase(TR)} kategorisinde ${sayiBicim.format(bb.toplam)} kayıt var.` : `${durum.il} için bu kategoride henüz kayıt yok.` }),
        bb.toplam ? el('p', { text: 'Bu kategori çok kalabalık olduğu için kayıtlar bölge bölge açılır: bir ilçe seç ya da haritada bir alana yakınlaşıp "Bu alanı tara"ya bas.' }) : null,
        dugmeler.length ? el('div', { class: 'ilce-dugmeleri' }, dugmeler) : null);
    } else if (bb.durum === 'yukleniyor') {
      kutu.append(el('p', { text: `${bolgeAdi()} için ${kat.ad.toLocaleLowerCase(TR)} yükleniyor…` }));
    } else if (bb.durum === 'cok') {
      kutu.append(el('p', { text: `Haritadaki bu alanda ${sayiBicim.format(bb.toplam)} kayıt var; bir kerede göstermek için çok fazla.` }),
        el('p', { text: `Haritada yakınlaşıp yeniden tara ya da bir ilçe seç (en çok ${sayiBicim.format(ALAN_UST_SINIR)} kayıt).` }));
    } else if (bb.durum === 'hata') {
      const tekrar = el('button', { class: 'dugme', type: 'button', text: 'Yeniden dene' });
      tekrar.addEventListener('click', () => { for (const [a, v] of bolge.yuklenen) if (v.durum === 'hata') bolge.yuklenen.delete(a); guncelle(); });
      kutu.append(el('p', { text: 'Kayıtlar şu an alınamadı.' }), tekrar);
    } else {
      kutu.append(el('p', { text: 'Bu kategorinin kayıtları yalnızca veritabanından okunabiliyor; şu an ulaşılamıyor. Sayfayı yenileyip yeniden dene.' }));
    }
    return kutu;
  }

  /* ---------- harita ---------- */
  let harita = null, bolgeKatmani = null, kume = null;
  const igneler = new Map();   // id → { igne, m, secili }
  const SINIR_ATIF = 'Sınırlar &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> katkıcıları';

  function haritaNotu(metin) {
    const n = $('#haritaNot');
    n.textContent = metin || '';
    n.hidden = !metin;
  }

  // İlin sınır kutusu ([batı, güney, doğu, kuzey]) Leaflet sınırına çevrilir; pay: kenarlarda kaydırma payı (oran).
  function ilKutusu(il, pay = 0) {
    const k = sinirlar.iller && sinirlar.iller[il] && sinirlar.iller[il].kutu;
    if (!k) return null;
    const [b, g, d, n] = k;
    const p = Math.max(d - b, n - g) * pay;
    return L.latLngBounds([[g - p, b - p], [n + p, d + p]]);
  }

  /* ---------- görünüm: otomatik / gündüz / gece ---------- */
  // Sayfa renkleri :root değişkenlerinden gelir (data-theme ile zorlanır); harita stili ona eşlik eder.
  const GORUNUMLER = {
    otomatik: { etiket: 'Görünüm: otomatik (cihaz ayarına göre)', simge: 'otomatik', sonraki: 'gunduz' },
    gunduz:   { etiket: 'Görünüm: gündüz', simge: 'gunduz', sonraki: 'gece' },
    gece:     { etiket: 'Görünüm: gece', simge: 'gece', sonraki: 'otomatik' },
  };
  const HARITA_STILI = { acik: 'https://tiles.openfreemap.org/styles/bright', koyu: 'https://tiles.openfreemap.org/styles/fiord' };
  const sistemKoyu = matchMedia('(prefers-color-scheme: dark)');
  let gorunum = 'otomatik', vektorHarita = null;
  try { const g = localStorage.getItem('kesif-gorunum'); if (GORUNUMLER[g]) gorunum = g; } catch (e) {}

  const koyuMu = () => gorunum === 'gece' || (gorunum === 'otomatik' && sistemKoyu.matches);
  const haritaStili = () => HARITA_STILI[koyuMu() ? 'koyu' : 'acik'];

  function gorunumUygula() {
    const kok = document.documentElement;
    if (gorunum === 'otomatik') delete kok.dataset.theme;
    else kok.dataset.theme = gorunum === 'gece' ? 'dark' : 'light';
    const d = $('#gorunumDugme');
    if (d) {
      const g = GORUNUMLER[gorunum];
      d.replaceChildren(simge(g.simge));
      d.title = g.etiket + ' — değiştirmek için dokun';
      d.setAttribute('aria-label', g.etiket);
    }
    if (vektorHarita) {
      const yeni = haritaStili();
      if (vektorHarita.__stil !== yeni) { vektorHarita.__stil = yeni; vektorHarita.setStyle(yeni); }
    }
  }
  function gorunumKur() {
    gorunumUygula();
    $('#gorunumDugme').addEventListener('click', () => {
      gorunum = GORUNUMLER[gorunum].sonraki;
      try { localStorage.setItem('kesif-gorunum', gorunum); } catch (e) {}
      gorunumUygula();
    });
    sistemKoyu.addEventListener('change', () => { if (gorunum === 'otomatik') gorunumUygula(); });
  }

  // Şematik zemin: ilçe/mahalle sınırları ve adları (sokak haritası gelmezse görünen katman).
  function zemineEkle(features, atif) {
    if (!harita || !features.length) return;
    L.geoJSON({ type: 'FeatureCollection', features }, {
      pane: 'zemin', interactive: false, attribution: atif || null,
      style: f => ({ className: `sinir sinir-${f.properties.tur}` }),
    }).addTo(harita);
    for (const f of features) {
      const p = f.properties;
      if (!p.yazi) continue;
      L.marker([p.yazi[1], p.yazi[0]], {
        pane: 'zeminYazi', interactive: false, keyboard: false,
        icon: L.divIcon({ className: `yer-adi yer-${p.tur}`, html: el('span', { text: p.ad }), iconSize: [0, 0] }),
      }).addTo(harita);
    }
  }

  // İlçe sınırları il başına veritabanından gelir (sinirlar.json yalnızca il kutularını taşır).
  // Yüklenen il sinirlar.features'a eklenir; seçili ilse ilçe çizgisi yeniden çizilir.
  const ilSinirDurumu = new Map();   // il -> Promise
  function ilSiniriYuklu(il) {
    return sinirlar.features.some(f => f.properties.tur === 'ilce' && f.properties.il === il);
  }
  function ilSinirYukle(il) {
    if (!il || !AYAR.veritabani || ilSiniriYuklu(il)) return Promise.resolve(true);
    if (ilSinirDurumu.has(il)) return ilSinirDurumu.get(il);
    const is = rpc('il_sinirlari', { p_il: il })
      .then(f => {
        const yeni = (Array.isArray(f) ? f : []).filter(x => x && x.geometry && x.properties && x.properties.il === il);
        if (!yeni.length || ilSiniriYuklu(il)) return false;
        sinirlar.features.push(...yeni);
        zemineEkle(yeni);
        if (durum.il === il && durum.ilce !== TUM && !durum.gorunum) bolgeyiCiz();   // yalnız seçili ilçe çizgisi için; görünüm yeniden sığdırılmaz
        return true;
      })
      .catch(hata => { console.warn('İlçe sınırları yüklenemedi:', il, hata); ilSinirDurumu.delete(il); return false; });
    ilSinirDurumu.set(il, is);
    return is;
  }

  function haritaKur() {
    if (!HARITA_VAR) { haritaNotu('Harita yüklenemedi. Liste ve filtreler çalışıyor.'); return; }
    harita = L.map('harita', {
      // Karo görselleri yalnızca tam yakınlık basamaklarında net durur; şematik zemin her basamakta nettir.
      zoomControl: false, minZoom: 6, maxZoom: 18, zoomSnap: AYAR.altliklar.length ? 1 : 0.25, zoomDelta: AYAR.altliklar.length ? 1 : 0.5,
      maxBoundsViscosity: 0.9,
    });
    harita.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');

    // Şematik zemin karoların altında durur: karo gelirse üstünü örter, gelmezse zemin görünür kalır.
    harita.createPane('zemin').style.zIndex = 150;
    const yaziKatmani = harita.createPane('zeminYazi');
    yaziKatmani.style.zIndex = 160;
    yaziKatmani.style.pointerEvents = 'none';
    zemineEkle(sinirlar.features, AYAR.altliklar.length ? null : SINIR_ATIF);

    // Yakın iğneler sayılı tek daireye toplanır; sokak ölçeğinde (16) kümeleme kalkar.
    kume = KUME_VAR
      ? L.markerClusterGroup({
        showCoverageOnHover: false, maxClusterRadius: 40, disableClusteringAtZoom: 16, spiderfyOnMaxZoom: false, chunkedLoading: true,
        animate: !azHareket, animateAddingMarkers: false,
        iconCreateFunction: k => {
          const n = k.getChildCount();
          const boy = n < 10 ? 36 : n < 100 ? 42 : 48;
          return L.divIcon({ className: 'kume', html: el('span', { text: n }), iconSize: [boy, boy] });
        },
      })
      : L.layerGroup();
    kume.addTo(harita);

    if (AYAR.altliklar.length) karoKur(0);
    else haritaNotu('Şematik harita: ilçe ve mahalle sınırları');

    L.control.zoom({ position: 'bottomright', zoomInTitle: 'Yakınlaştır', zoomOutTitle: 'Uzaklaştır' }).addTo(harita);
    const Sigdir = L.Control.extend({
      options: { position: 'bottomright' },
      onAdd() {
        const kap = el('div', { class: 'leaflet-bar' });
        const d = el('button', { type: 'button', title: 'Bölgenin tamamını göster', 'aria-label': 'Bölgenin tamamını göster' }, simge('cerceve'));
        d.addEventListener('click', () => bolgeyeSigdir(true));
        L.DomEvent.disableClickPropagation(kap);
        kap.append(d);
        return kap;
      },
    });
    new Sigdir().addTo(harita);
    konumDugmesiKur();

    // Şematik zeminde yazılar: uzakta yazı yok, ortada ilçe adları, yakında mahalle adları.
    const yakinlik = () => {
      const z = harita.getZoom(), kap = harita.getContainer();
      kap.classList.toggle('uzak', z < 10.5);
      kap.classList.toggle('yakin', z >= 12.75);
    };
    harita.on('zoomend', yakinlik);
    new ResizeObserver(() => harita.invalidateSize({ pan: false })).observe(harita.getContainer());

    if (AYAR.koordinatAraci) koordinatAraciKur();
    taraKur();
    bolgeyiCiz();
    yakinlik();
  }

  // Sokak haritası: sıradaki sağlayıcıdan hiç karo gelmeden art arda hata olursa bir sonrakine geçilir.
  // Hepsi tükenirse şematik zemin görünür kalır ve not çıkar.
  function karoKur(sira) {
    const a = AYAR.altliklar[sira];
    if (!a) {
      harita.getContainer().dataset.altlik = 'yok';
      haritaNotu('Sokak haritası yüklenemedi. İlçe ve mahalle sınırları gösteriliyor.');
      return;
    }
    // Vektör katman haritanın merkezi belli olunca eklenebilir (whenReady).
    if (a.tur === 'vektor') { harita.whenReady(() => vektorKur(a, sira)); return; }
    const karo = L.tileLayer(a.url, { attribution: a.atif, subdomains: a.altAlanlar || 'abc', maxZoom: 20, maxNativeZoom: a.enYakin || 19 }).addTo(harita);
    harita.getContainer().dataset.altlik = a.ad || String(sira);
    let gelen = 0, hata = 0, birakildi = false;
    karo.on('tileload', () => { gelen++; });
    karo.on('tileerror', () => {
      hata++;
      if (birakildi || gelen || hata < 4) return;
      birakildi = true;
      karo.remove();
      karoKur(sira + 1);
    });
  }

  // Vektör harita (MapLibre, Leaflet köprüsüyle): stili görünüm (gündüz/gece) belirler.
  // 10 saniyede yüklenmezse ya da kütüphane yoksa sıradaki altlığa (resim karolar) geçilir.
  function vektorKur(a, sira) {
    if (!window.L.maplibreGL || !window.maplibregl) { karoKur(sira + 1); return; }
    let gl;
    try {
      gl = L.maplibreGL({ style: haritaStili(), attribution: a.atif, interactive: false }).addTo(harita);
    } catch (e) { karoKur(sira + 1); return; }
    harita.getContainer().dataset.altlik = a.ad || String(sira);
    const m = gl.getMaplibreMap();
    let yuklendi = false;
    m.once('load', () => { yuklendi = true; });
    m.once('styledata', () => { yuklendi = true; });   // stil geldiyse sunucu çalışıyor demektir; karolar sonra da gelebilir
    // Sayfa ilk açılışta veriyle meşgulken 'load' gecikebilir: yalnız stil hiç gelmezse yedeğe geçilir.
    setTimeout(() => {
      if (yuklendi || (m.isStyleLoaded && m.isStyleLoaded())) return;
      gl.remove();
      vektorHarita = null;
      karoKur(sira + 1);
    }, 20000);
    m.__stil = haritaStili();
    vektorHarita = m;
  }

  // Seçili bölge: ilçe seçiliyse sınırı çizilir; harita seçili ilin içinde tutulur.
  function bolgeyiCiz() {
    if (!harita) return;
    taraGoster(false);
    if (bolgeKatmani) { bolgeKatmani.remove(); bolgeKatmani = null; }
    if (!ilSiniriYuklu(durum.il)) ilSinirYukle(durum.il);   // gelince bolgeyiCiz yeniden çağrılır
    if (durum.ilce !== TUM && !durum.gorunum) {
      const ilce = sinirlar.features.filter(f => f.properties.tur === 'ilce' && f.properties.il === durum.il && f.properties.ad === durum.ilce);
      if (ilce.length) {
        bolgeKatmani = L.geoJSON({ type: 'FeatureCollection', features: ilce }, { interactive: false, style: { className: 'sinir sinir-secili' } }).addTo(harita);
      }
    }
    harita.setMaxBounds(null);
    bolgeyeSigdir(false);
    if (durum.gorunum) return;
    const sinir = ilKutusu(durum.il, 0.15);
    if (sinir) harita.setMaxBounds(sinir);
  }

  function bolgeKutusu() {
    if (durum.gorunum) {
      const kume = gorunumKumesi();
      const yerler = kume ? kumedekiler(kume).filter(m => m.konum).map(m => [m.konum.lat, m.konum.lng]) : [];
      return yerler.length ? L.latLngBounds(yerler).pad(0.15) : ilKutusu(durum.il);
    }
    if (durum.alan) return durum.alan;
    if (bolgeKatmani) return bolgeKatmani.getBounds();
    const il = ilKutusu(durum.il);
    if (durum.ilce === TUM && il) return il;
    const konumlu = bolgeMekanlari().filter(m => m.konum).map(m => [m.konum.lat, m.konum.lng]);
    if (konumlu.length) return L.latLngBounds(konumlu);
    return il;
  }

  function bolgeyeSigdir(canli) {
    if (!harita) return;
    kullaniciAni = 0;   // programla yapılan kaydırma "Bu alanı tara"yı çıkarmaz
    const kutu = bolgeKutusu();
    if (kutu) harita.fitBounds(kutu, { padding: [14, 14], maxZoom: 16, animate: canli && !azHareket });
  }

  const harfi = () => kategoriler[durum.kategori].simge || kategoriler[durum.kategori].ad.trim().charAt(0).toLocaleUpperCase(TR);
  const igneIkonu = (harf, secili) => L.divIcon({ className: secili ? 'igne secili' : 'igne', html: el('span', { class: 'levha', text: harf }), iconSize: [30, 40], iconAnchor: [15, 40] });
  // İğne öğesi kümeden çıkınca yeniden yaratılır; erişilebilirlik bilgisi her seferinde yeniden yazılır.
  function igneyiEtiketle(k) {
    const e = k.igne.getElement();
    if (!e) return;
    e.setAttribute('aria-label', k.m.ad);
    e.dataset.id = k.m.id;
  }

  function igneleriCiz(uyan) {
    if (!harita) return;
    const olmali = new Map(uyan.filter(m => m.konum).map(m => [m.id, m]));
    const cikan = [];
    for (const [id, k] of igneler) if (!olmali.has(id)) { cikan.push(k.igne); igneler.delete(id); }
    if (cikan.length) KUME_VAR ? kume.removeLayers(cikan) : cikan.forEach(i => kume.removeLayer(i));
    const eklenen = [];
    for (const [id, m] of olmali) {
      if (igneler.has(id)) continue;
      const harf = kategoriler[m.kategori].simge || kategoriler[m.kategori].ad.trim().charAt(0).toLocaleUpperCase(TR);
      const igne = L.marker([m.konum.lat, m.konum.lng], { keyboard: true, riseOnHover: true, icon: igneIkonu(harf, false) });
      const k = { igne, m, harf, secili: false };
      igne.bindTooltip(m.ad, { direction: 'top', offset: [0, -42] });
      igne.on('click', () => mekanSayfasiniAc(m, { kaynak: 'harita' }));
      igne.on('add', () => igneyiEtiketle(k));
      igneler.set(id, k);
      eklenen.push(igne);
    }
    if (eklenen.length) KUME_VAR ? kume.addLayers(eklenen) : eklenen.forEach(i => kume.addLayer(i));
    harita.getContainer().dataset.igne = igneler.size;   // haritadaki (kümelenmiş olsa da) iğne sayısı
  }

  /* ---------- "Bu alanı tara" ---------- */
  // Ziyaretçi haritayı kendisi kaydırınca ya da yakınlaştırınca düğme çıkar; basınca liste o anki harita alanıyla sınırlanır
  // (seçili kategori ve filtreler geçerli kalır, ilçe seçimi yerine alan geçer). Programla yapılan kaydırmalar düğmeyi çıkarmaz.
  let kullaniciAni = 0, taraDugmesi = null, alanKatmani = null;
  function taraKur() {
    taraDugmesi = el('button', { class: 'tara-dugme', type: 'button', hidden: true }, simge('ara'), 'Bu alanı tara');
    taraDugmesi.addEventListener('click', alaniTara);
    $('.harita-kap').append(taraDugmesi);
    const kap = harita.getContainer();
    const isaretle = () => { kullaniciAni = Date.now(); };
    for (const olay of ['pointerdown', 'pointerup', 'wheel', 'touchstart', 'touchend', 'keydown']) kap.addEventListener(olay, isaretle, { passive: true });
    let tumuBekliyor = null;
    harita.on('moveend', () => {
      // "Tümü"de tarama düğmesi yok: harita her durduğunda o alan kendiliğinden yüklenir.
      if (tumuMu()) { clearTimeout(tumuBekliyor); tumuBekliyor = setTimeout(guncelle, 200); return; }
      if (durum.gorunum || Date.now() - kullaniciAni > 1200) return;
      taraGoster(true);
    });
  }
  function taraGoster(goster) { if (taraDugmesi) taraDugmesi.hidden = !goster; }
  function alaniTara() {
    durum.alan = harita.getBounds();
    durum.secili = null;
    taraGoster(false);
    guncelle();
    $('#sonuclar').scrollTop = 0;
  }
  // Taranan alan haritada kesik çizgili bir çerçeveyle gösterilir.
  function alaniCiz() {
    if (!harita) return;
    const istenen = durum.alan && !durum.gorunum ? durum.alan : null;
    harita.getContainer().dataset.alan = istenen ? istenen.toBBoxString() : '';   // taranan alan: batı,güney,doğu,kuzey
    if (alanKatmani && alanKatmani.kesifAlan !== istenen) { alanKatmani.remove(); alanKatmani = null; }
    if (istenen && !alanKatmani) {
      alanKatmani = L.rectangle(istenen, { className: 'tara-alan', interactive: false }).addTo(harita);
      alanKatmani.kesifAlan = istenen;
    }
  }

  function koordinatAraciKur() {
    let acik = false, nokta = null;
    const dugme = el('button', { type: 'button', class: 'koor-dugme', 'aria-pressed': 'false', text: 'Koordinat al' });
    const Arac = L.Control.extend({
      options: { position: 'topright' },
      onAdd() { const kap = el('div', { class: 'leaflet-bar' }, dugme); L.DomEvent.disableClickPropagation(kap); return kap; },
    });
    new Arac().addTo(harita);
    dugme.addEventListener('click', () => {
      acik = !acik;
      dugme.setAttribute('aria-pressed', String(acik));
      dugme.textContent = acik ? 'Haritada bir yere tıkla' : 'Koordinat al';
      harita.getContainer().classList.toggle('koor-modu', acik);
      if (!acik) { $('#koorKutu').hidden = true; if (nokta) { nokta.remove(); nokta = null; } }
    });
    harita.on('click', e => {
      if (!acik) return;
      const metin = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
      $('#koorDeger').textContent = metin;
      $('#koorKutu').hidden = false;
      if (nokta) nokta.setLatLng(e.latlng);
      else nokta = L.marker(e.latlng, { interactive: false, keyboard: false, icon: L.divIcon({ className: 'koor-nokta', iconSize: [12, 12] }) }).addTo(harita);
    });
    $('#koorKopya').addEventListener('click', () => kopyala($('#koorDeger').textContent, $('#koorKopya'), $('#koorDeger')));
  }

  /* ---------- seçim: liste ve harita birlikte ---------- */
  // Seçili kayıt haritada görünür hâle getirilir: kümedeyse küme açılır, sonra iğne ortalanır.
  // Programla yapılan bu kaydırma "Bu alanı tara"yı çıkarmaz.
  function haritadaOrtala(id) {
    const k = igneler.get(id);
    if (!k && tumuMu() && harita && harita.getContainer().offsetWidth) {
      // "Tümü"de iğne yalnızca ekrandaki alan için çizilir: kayda gidilir, iğnesi harita durunca gelir.
      const m = mekanBul(id);
      if (!m || !m.konum) return false;
      kullaniciAni = 0;
