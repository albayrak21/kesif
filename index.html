:root {

  --yuzey: #FAFBFA;
  --yuzey-2: #FFFFFF;
  --murekkep: #13232A;
  --soluk: #56676D;
  --cizgi: #D2DAD9;
  --cizgi-koyu: #A9B6B5;
  --vurgu: #0E5AA7;
  --vurgu-dolgu: #0E5AA7;
  --vurgu-ustu: #FFFFFF;
  --vurgu-soluk: #E1ECF8;
  --secim: #F2B21C;
  --secim-ustu: #1B1503;
  --olumlu: #1C7248;
  --uyari: #8A5A00;
  --h-deniz: #C9DCE7;
  --h-kara: #F7F7F2;
  --h-kara-2: #E2E7E1;
  --h-cizgi: #A7B4AF;
  --perde: rgb(8 16 20 / .45);
  --golge: 0 1px 2px rgb(19 35 42 / .14), 0 4px 12px rgb(19 35 42 / .10);
  --yazi: "Barlow", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --yazi-dar: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {

    --zemin: #0E1618; --yuzey: #151F23; --yuzey-2: #1B282D; --murekkep: #E7EEED; --soluk: #9BAEB1;
    --cizgi: #2A3A3F; --cizgi-koyu: #46595F; --vurgu: #86BDF7; --vurgu-dolgu: #2670C4; --vurgu-ustu: #FFFFFF;
    --vurgu-soluk: #17304A; --secim: #F5BD33; --secim-ustu: #1B1503; --olumlu: #6FCB9B; --uyari: #E2B45A;
    --h-deniz: #0C202B; --h-kara: #1E2C2E; --h-kara-2: #172325; --h-cizgi: #3F5356;
    --perde: rgb(0 0 0 / .6);

  }
}

}

/* Leaflet 1.9.4 stil dosyası (görsel çağrıları çıkarıldı) */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {

	height: 1600px;

	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }

.leaflet-map-pane canvas { z-index: 100; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {

	pointer-events: none;
	}
.leaflet-top {

.leaflet-right {

.leaflet-left {

	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;

.leaflet-zoom-anim .leaflet-zoom-hide {

.leaflet-marker-icon,

/* visual tweaks */

.leaflet-container {

	}

/* general typography */
.leaflet-container {

/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;

	}
.leaflet-bar a,
.leaflet-control-layers-toggle {

.leaflet-bar a:hover,

.leaflet-touch .leaflet-bar a {

.leaflet-popup {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;

html { height: 100%; box-sizing: border-box; }
body { height: 100%; margin: 0; background: var(--zemin); color: var(--murekkep); font: 400 15px/1.45 var(--yazi); -webkit-text-size-adjust: 100%; }
.uyg, .uyg *, .uyg *::before, .uyg *::after { box-sizing: border-box; }
.uyg :focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; }
.gorunmez { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- iskelet ---------- */
.uyg {
  height: 100%;
  display: grid;
  grid-template-columns: 300px 384px minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "ust ust ust" "panel sonuc harita";
}
.ust { grid-area: ust; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--yuzey); border-bottom: 1px solid var(--cizgi); }

    var: 'M3.2 8.6l3.1 3 6.5-7.2',
    yok: 'M4 4l8 8M12 4l-8 8',
    bilinmiyor: 'M5.8 6.1a2.2 2.2 0 1 1 3.3 1.9c-.7.4-1.1.9-1.1 1.7M8 12.6v.1',
    yersiz: 'M8 14s4-3.6 4-7a4 4 0 0 0-8 0c0 3.4 4 7 4 7zM3 2.5l10 11',
    dis: 'M9 3h4v4M13 3L7.5 8.5M11 9.5V13H3V5h3.5',
    cerceve: 'M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10',
  };
  function simge(ad) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 16 16'); s.setAttribute('aria-hidden', 'true'); s.setAttribute('class', 'simge');
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', SIMGE[ad]); p.setAttribute('fill', 'none');
    s.append(p);
    return s;
  }
  const duz = s => s.toLocaleLowerCase(TR)
    .replace(/[çğıöşü]/g, c => ({ ç: 'c', ğ: 'g', ı: 'i', ö: 'o', ş: 's', ü: 'u' }[c]))
    .replace(/[^a-z0-9]+/g, ' ').trim();
  const tarihYaz = t => t.split('-').reverse().join('.');
  async function kopyala(metin, dugme, kaynak) {
    const eski = dugme.textContent;
    try {
      await navigator.clipboard.writeText(metin);
      dugme.textContent = 'Kopyalandı';
    } catch {
      const r = document.createRange(); r.selectNodeContents(kaynak);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      dugme.textContent = 'Seçildi, kopyalayabilirsin';
    }
    setTimeout(() => { dugme.textContent = eski; }, 1800);
  }

  /* ---------- veri: tek giriş noktası ---------- */
  // Bugün dosyadan okunur. İleride veritabanına geçilirse yalnızca bu fonksiyon değişir.
  async function veriyiGetir() {
    if (window.KESIF_VERI) return window.KESIF_VERI;
    const oku = async ad => {
      const y = await fetch(`${AYAR.veriYolu}${ad}.json`);
      if (!y.ok) throw new Error(`${ad}: ${y.status}`);
      return y.json();
    };
    const [kategoriler, mekanlar, sinirlar] = await Promise.all(['kategoriler', 'mekanlar', 'sinirlar'].map(oku));
    return { kategoriler, mekanlar, sinirlar };
  }

  let kategoriler, mekanlar, sinirlar;
  const durum = { il: null, ilce: null, kategori: null, secimler: {}, secili: null };

  const filtreler = () => kategoriler[durum.kategori].filtreler;
  const bolgeMekanlari = () => mekanlar
    .filter(m => m.kategori === durum.kategori && m.il === durum.il && m.ilce === durum.ilce)
    .sort((a, b) => a.ad.localeCompare(b.ad, TR));
  const aktifMi = (f, s) => f.tip === 'coklu' ? !!(s && s.size) : s != null && s !== false;
  const secenekEtiketi = (f, deger) => (f.secenekler.find(o => o.deger === deger) || { etiket: deger }).etiket;

  /* ---------- eşleşme: uyar / uymaz / belirsiz ---------- */
  // Bilinmeyen değer (null) "hayır" sayılmaz. Kesin uymayan elenir; bilgisi eksik olan ayrı listelenir.
  function degerlendir(mekan, secimler) {
    const eksik = [];
    let uymaz = false;
    for (const f of filtreler()) {
      const s = secimler[f.alan];
      if (!aktifMi(f, s)) continue;
      const v = mekan.ozellikler[f.alan];
      if (v == null) { eksik.push(f); continue; }
      if (f.tip === 'secim') uymaz = uymaz || v !== s;
      else if (f.tip === 'evet_hayir') uymaz = uymaz || v !== true;
      else if (f.tip === 'coklu') {
        const var_ = d => v.includes(d);
        uymaz = uymaz || !(f.eslesme === 'herhangi' ? [...s].some(var_) : [...s].every(var_));
      }
    }
    return { sonuc: uymaz ? 'uymaz' : eksik.length ? 'belirsiz' : 'uyar', eksik };
  }

  /* ---------- filtre paneli: kategori tanımından çizilir ---------- */
  let girdiler = [];   // { alan, deger, giris, kutu, adet }
  function filtreleriCiz() {
    const kap = $('#filtreler');
    kap.replaceChildren();
    girdiler = [];
    for (const f of filtreler()) {
      const bid = `fb-${f.alan}`;
      if (f.tip === 'secim') {
        const haplar = [{ deger: null, etiket: 'Hepsi' }, ...f.secenekler].map(o => {
          const adet = el('span', { class: 'adet' });
          const giris = el('input', { type: 'radio', name: `f-${f.alan}`, id: `f-${f.alan}-${o.deger || 'hepsi'}` });
          giris.addEventListener('change', () => { durum.secimler[f.alan] = o.deger; guncelle(); });
          const kutu = el('label', { class: 'hap' }, giris, el('span', { class: 'hap-yuz' }, o.etiket, adet));
          girdiler.push({ f, deger: o.deger, giris, kutu, adet });
          return kutu;
        });
        kap.append(el('div', { class: 'grup', role: 'radiogroup', 'aria-labelledby': bid },
          el('h3', { class: 'baslik-kucuk', id: bid, text: f.etiket }), el('div', { class: 'haplar' }, haplar)));
      } else if (f.tip === 'evet_hayir') {
        const adet = el('span', { class: 'adet' });
        const giris = el('input', { type: 'checkbox', role: 'switch', class: 'anahtar-giris', id: `f-${f.alan}` });
        giris.addEventListener('change', () => { durum.secimler[f.alan] = giris.checked ? true : null; guncelle(); });
        const kutu = el('div', { class: 'grup anahtar' }, el('label', { for: giris.id, text: f.etiket }), adet, giris);
        girdiler.push({ f, deger: true, giris, kutu, adet });
        kap.append(kutu);
      } else if (f.tip === 'coklu') {
        const ogeler = f.secenekler.map(o => {
          const adet = el('span', { class: 'adet' });
          const giris = el('input', { type: 'checkbox', id: `f-${f.alan}-${o.deger}` });
          giris.addEventListener('change', () => {
            const s = durum.secimler[f.alan] || (durum.secimler[f.alan] = new Set());
            if (giris.checked) s.add(o.deger); else s.delete(o.deger);
            guncelle();
          });
          const kutu = el('li', { class: 'cok-oge' }, el('label', null, giris, el('span', { class: 'cok-ad', text: o.etiket }), adet));
          girdiler.push({ f, deger: o.deger, giris, kutu, adet });
          return { kutu, anahtar: duz(o.etiket) };
        });
        const seciliSayi = el('span', { class: 'secili-sayi', id: `ss-${f.alan}` });
        const yok = el('p', { class: 'ipucu', text: 'Bu adla bir seçenek yok.', hidden: true });
        let ara = null;
        if (f.secenekler.length > 8) {
          ara = el('input', { type: 'search', class: 'ara', id: `ara-${f.alan}`, placeholder: `${f.etiket} içinde ara`, 'aria-label': `${f.etiket} içinde ara`, autocomplete: 'off' });
          ara.addEventListener('input', () => {
            const q = duz(ara.value);
            let gorunen = 0;
            for (const o of ogeler) { const g = !q || o.anahtar.includes(q); o.kutu.hidden = !g; if (g) gorunen++; }
            yok.hidden = gorunen > 0;
          });
        }
        kap.append(el('div', { class: 'grup', role: 'group', 'aria-labelledby': bid },
          el('div', { class: 'grup-bas' }, el('h3', { class: 'baslik-kucuk', id: bid, text: f.etiket }), seciliSayi),
          el('p', { class: 'ipucu', text: f.eslesme === 'herhangi' ? 'Seçtiklerinden en az birini sunanlar gösterilir.' : 'Seçtiklerinin hepsini sunanlar gösterilir.' }),
          ara, el('ul', { class: 'cok' }, ogeler.map(o => o.kutu)), yok));
      }
    }
  }

  // Girişleri duruma eşitler ve her seçeneğin yanına "bunu seçersem kaç sonuç kalır" sayısını yazar.
  function paneliEsle(tum) {
    const say = degistir => {
      const s = { ...durum.secimler };
      degistir(s);
      return tum.filter(m => degerlendir(m, s).sonuc === 'uyar').length;
    };
    for (const g of girdiler) {
      const { f } = g;
      const s = durum.secimler[f.alan];
      let n;
      if (f.tip === 'secim') { g.giris.checked = (s ?? null) === g.deger; n = say(x => { x[f.alan] = g.deger; }); }
      else if (f.tip === 'evet_hayir') { g.giris.checked = s === true; n = say(x => { x[f.alan] = true; }); }
      else { g.giris.checked = !!(s && s.has(g.deger)); n = say(x => { x[f.alan] = new Set(s || []).add(g.deger); }); }
      g.adet.textContent = n;
      g.kutu.classList.toggle('bos', n === 0 && !g.giris.checked);
    }
    for (const f of filtreler()) {
      if (f.tip !== 'coklu') continue;
      const n = (durum.secimler[f.alan] || new Set()).size;
      $(`#ss-${f.alan}`).textContent = n ? `${n} seçili` : '';
    }
  }

  function aktifler() {
    const a = [];
    for (const f of filtreler()) {
      const s = durum.secimler[f.alan];
      if (!aktifMi(f, s)) continue;
      if (f.tip === 'secim') a.push({ etiket: secenekEtiketi(f, s), kaldir: () => { durum.secimler[f.alan] = null; } });
      else if (f.tip === 'evet_hayir') a.push({ etiket: f.etiket, kaldir: () => { durum.secimler[f.alan] = null; } });
      else for (const d of f.secenekler.filter(o => s.has(o.deger))) a.push({ etiket: d.etiket, kaldir: () => { s.delete(d.deger); } });
    }
    return a;
  }

  /* ---------- sonuç listesi ---------- */
  function ozetOgeleri(m) {
    const ogeler = [];
    for (const f of filtreler()) {
      const v = m.ozellikler[f.alan];
      if (v == null) ogeler.push(el('li', { class: 'olgu bilinmiyor' }, simge('bilinmiyor'), `${f.etiket} bilinmiyor`));
      else if (f.tip === 'secim') ogeler.push(el('li', { class: 'tip', text: secenekEtiketi(f, v) }));
      else if (f.tip === 'evet_hayir') ogeler.push(el('li', { class: `olgu ${v ? 'var' : 'yok'}` }, simge(v ? 'var' : 'yok'), `${f.etiket} ${v ? 'var' : 'yok'}`));
      else if (f.tip === 'coklu') ogeler.push(el('li', { class: 'olgu', text: `${f.etiket}: ${v.length}` }));
    }
    if (!m.konum) ogeler.push(el('li', { class: 'olgu yersiz' }, simge('yersiz'), 'Haritada yeri yok'));
    return ogeler;
  }

  function ayrinti(m) {
    const bekleyen = new Set(m.dogrulanacak || []);
    const teyit = alan => bekleyen.has(alan) ? el('span', { class: 'teyit', text: 'teyit bekliyor' }) : null;
    const satirlar = [];
    for (const f of filtreler()) {
      const v = m.ozellikler[f.alan];
      const genis = f.tip === 'coklu' && v != null ? 'genis' : null;
      let dd;
      if (v == null) dd = el('dd', { class: 'bilinmiyor', text: 'bilinmiyor' });
      else if (f.tip === 'secim') dd = el('dd', { text: secenekEtiketi(f, v) });
      else if (f.tip === 'evet_hayir') dd = el('dd', { text: v ? 'var' : 'yok' });
      else {
        const aranan = durum.secimler[f.alan] || new Set();
        dd = el('dd', { class: genis }, el('ul', { class: 'dallar' },
          f.secenekler.filter(o => v.includes(o.deger)).map(o => el('li', { class: aranan.has(o.deger) ? 'aranan' : null, text: o.etiket }))));
      }
      const dt = el('dt', { class: genis, text: genis ? `${f.etiket} (${v.length})` : f.etiket });
      const t = teyit(f.alan);
      if (t) (genis ? dt : dd).append(' ', t);
      satirlar.push(dt, dd);
    }
    satirlar.push(el('dt', { text: 'Adres' }), el('dd', null, m.adres, teyit('adres')));
    if (m.telefon) {
      const no = el('a', { class: 'tel', href: `tel:${m.telefon.replace(/\s/g, '')}`, text: m.telefon });
      const kopya = el('button', { class: 'bag kopya', type: 'button', text: 'Kopyala' });
      kopya.addEventListener('click', () => kopyala(m.telefon, kopya, no));
      satirlar.push(el('dt', { text: 'Telefon' }), el('dd', null, no, kopya, teyit('telefon')));
    }
    satirlar.push(el('dt', { text: 'Bilgi tarihi' }), el('dd', { text: tarihYaz(m.dogrulama_tarihi) }));

    const eylemler = [el('a', { class: 'dugme', href: m.web, target: '_blank', rel: 'noopener noreferrer' }, 'Web sitesi', simge('dis'))];
    if (m.konum) eylemler.push(el('a', { class: 'dugme', target: '_blank', rel: 'noopener noreferrer',
      href: `https://www.google.com/maps/dir/?api=1&destination=${m.konum.lat},${m.konum.lng}` }, 'Yol tarifi', simge('dis')));
    const konumNotu = !m.konum ? 'Haritadaki yeri henüz işaretlenmedi.'
      : bekleyen.has('konum') ? 'Haritadaki yeri yaklaşık olabilir, teyit bekliyor.' : null;
    return el('div', { class: 'ayrinti', id: `ayr-${m.id}`, hidden: true },
      el('dl', { class: 'bilgi' }, satirlar),
      konumNotu && el('p', { class: 'uyari-not', text: konumNotu }),
      el('div', { class: 'eylemler' }, eylemler));
  }

  function kart(m, eksik) {
    const bas = el('button', { class: 'kart-bas', type: 'button', 'aria-expanded': 'false', 'aria-controls': `ayr-${m.id}` },
      el('span', { class: 'kart-ad', text: m.ad }), el('span', { class: 'kart-adres', text: m.adres }));
    bas.addEventListener('click', () => sec(m.id, 'liste'));
    return el('li', { class: 'kart', 'data-id': m.id },
      bas,
      el('ul', { class: 'ozet' }, ozetOgeleri(m)),
      eksik && eksik.length ? el('p', { class: 'neden', text: `Bilinmeyen: ${eksik.map(f => f.etiket).join(', ')}` }) : null,
      ayrinti(m));
  }

  function listeyiCiz(tum, uyan, belirsiz) {
    const aktif = aktifler();
    $('#sonucSayi').textContent = `${uyan.length} sonuç`;
    const notlar = [];
    if (aktif.length) notlar.push(`${tum.length} kayıt içinden`);
    const yersiz = uyan.filter(m => !m.konum).length;
    if (yersiz) notlar.push(`${yersiz} sonucun haritada yeri henüz yok`);
    const not = $('#sonucNot');
    not.textContent = notlar.join(' · ');
    not.hidden = !notlar.length;

    const cipler = $('#cipler');
    cipler.replaceChildren(...aktif.map(a => {
      const kaldir = el('button', { type: 'button', 'aria-label': `${a.etiket} filtresini kaldır` }, simge('yok'));
      kaldir.addEventListener('click', () => { a.kaldir(); guncelle(); });
      return el('li', { class: 'cip' }, el('span', { class: 'cip-ad', text: a.etiket }), kaldir);
    }));
    cipler.hidden = !aktif.length;
    $('#temizle').hidden = !aktif.length;
    const rozet = $('#filtreSayisi');
    rozet.textContent = aktif.length;
    rozet.hidden = !aktif.length;
    $('#panelUygula').textContent = uyan.length ? `${uyan.length} sonucu göster` : 'Listeye dön';

    const liste = $('#liste');
    if (uyan.length) liste.replaceChildren(...uyan.map(m => kart(m)));
    else {
      const temizle = el('button', { class: 'dugme', type: 'button', text: 'Filtreleri temizle' });
      temizle.addEventListener('click', filtreleriTemizle);
      liste.replaceChildren(el('li', { class: 'bos-durum' },
        el('p', { text: belirsiz.length ? 'Bu filtrelere kesin olarak uyan sonuç yok. Bilgisi eksik kayıtlar aşağıda.' : 'Bu filtrelere uyan sonuç yok.' }), temizle));
    }
    $('#belirsiz').hidden = !belirsiz.length;
    $('#belirsizBaslik').textContent = `Bilgisi eksik: ${belirsiz.length} kayıt`;
    $('#belirsizListe').replaceChildren(...belirsiz.map(b => kart(b.m, b.eksik)));
  }

  /* ---------- harita ---------- */
  let harita = null, bolgeKatmani = null;
  const igneler = new Map();
  const SINIR_ATIF = 'Sınırlar &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> katkıcıları';

  function haritaNotu(metin) {
    const n = $('#haritaNot');
    n.textContent = metin || '';
    n.hidden = !metin;
  }

  function haritaKur() {
    if (!HARITA_VAR) { haritaNotu('Harita yüklenemedi. Liste ve filtreler çalışıyor.'); return; }
    const [bati, guney, dogu, kuzey] = sinirlar.kutu;
    harita = L.map('harita', {
      // Karo görselleri yalnızca tam yakınlık basamaklarında net durur; şematik zemin her basamakta nettir.
      zoomControl: false, minZoom: 11, maxZoom: 18, zoomSnap: AYAR.altliklar.length ? 1 : 0.25, zoomDelta: AYAR.altliklar.length ? 1 : 0.5,
      maxBounds: [[guney, bati], [kuzey, dogu]], maxBoundsViscosity: 0.9,
    });
    harita.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');

    // Şematik zemin karoların altında durur: karo gelirse üstünü örter, gelmezse zemin görünür kalır.
    harita.createPane('zemin').style.zIndex = 150;
    const yaziKatmani = harita.createPane('zeminYazi');
    yaziKatmani.style.zIndex = 160;
    yaziKatmani.style.pointerEvents = 'none';
    L.geoJSON(sinirlar, {
      pane: 'zemin', interactive: false, attribution: AYAR.altliklar.length ? null : SINIR_ATIF,
      style: f => ({ className: `sinir sinir-${f.properties.tur}` }),
    }).addTo(harita);
    for (const f of sinirlar.features) {
      const p = f.properties;
      if (p.tur === 'ilce' || !p.yazi) continue;
      L.marker([p.yazi[1], p.yazi[0]], {
        pane: 'zeminYazi', interactive: false, keyboard: false,
        icon: L.divIcon({ className: `yer-adi yer-${p.tur}`, html: el('span', { text: p.ad }), iconSize: [0, 0] }),
      }).addTo(harita);
    }

    if (AYAR.altliklar.length) karoKur(0);
    else haritaNotu('Şematik harita: ilçe ve mahalle sınırları');

    L.control.zoom({ position: 'bottomright', zoomInTitle: 'Yakınlaştır', zoomOutTitle: 'Uzaklaştır' }).addTo(harita);
    const Sigdir = L.Control.extend({
      options: { position: 'bottomright' },
      onAdd() {
        const kap = el('div', { class: 'leaflet-bar' });
        const d = el('button', { type: 'button', title: 'Bölgenin tamamını göster', 'aria-label': 'Bölgenin tamamını göster' }, simge('cerceve'));
        d.addEventListener('click', () => bolgeyeSigdir(true));
        L.DomEvent.disableClickPropagation(kap);
        kap.append(d);
        return kap;
      },
    });
    new Sigdir().addTo(harita);

    const yakinlik = () => harita.getContainer().classList.toggle('yakin', harita.getZoom() >= 12.75);
    harita.on('zoomend', yakinlik);
    new ResizeObserver(() => harita.invalidateSize({ pan: false })).observe(harita.getContainer());

    if (AYAR.koordinatAraci) koordinatAraciKur();
    bolgeyiCiz();
    yakinlik();
  }

  // Sokak haritası: sıradaki sağlayıcıdan hiç karo gelmeden art arda hata olursa bir sonrakine geçilir.
  // Hepsi tükenirse şematik zemin görünür kalır ve not çıkar.
  function karoKur(sira) {
    const a = AYAR.altliklar[sira];
    if (!a) {
      harita.getContainer().dataset.altlik = 'yok';
      haritaNotu('Sokak haritası yüklenemedi. İlçe ve mahalle sınırları gösteriliyor.');
      return;
    }
    const karo = L.tileLayer(a.url, { attribution: a.atif, subdomains: a.altAlanlar || 'abc', maxZoom: 20, maxNativeZoom: a.enYakin || 19 }).addTo(harita);
    harita.getContainer().dataset.altlik = a.ad || String(sira);
    let gelen = 0, hata = 0, birakildi = false;
    karo.on('tileload', () => { gelen++; });
    karo.on('tileerror', () => {
      hata++;
      if (birakildi || gelen || hata < 4) return;
      birakildi = true;
      karo.remove();
      karoKur(sira + 1);
    });
  }

  function bolgeyiCiz() {
    if (!harita) return;
    if (bolgeKatmani) bolgeKatmani.remove();
    const ilce = sinirlar.features.filter(f => f.properties.tur === 'ilce' && f.properties.ad === durum.ilce);
    bolgeKatmani = ilce.length
      ? L.geoJSON({ type: 'FeatureCollection', features: ilce }, { interactive: false, style: { className: 'sinir sinir-secili' } }).addTo(harita)
      : null;
    bolgeyeSigdir(false);
  }

  function bolgeyeSigdir(canli) {
    if (!harita) return;
    const konumlu = bolgeMekanlari().filter(m => m.konum).map(m => [m.konum.lat, m.konum.lng]);
    const kutu = bolgeKatmani ? bolgeKatmani.getBounds() : konumlu.length ? L.latLngBounds(konumlu) : null;
    if (kutu) harita.fitBounds(kutu, { padding: [14, 14], animate: canli && !azHareket });
  }

  function igneleriCiz(uyan) {
    if (!harita) return;
    const olmali = new Map(uyan.filter(m => m.konum).map(m => [m.id, m]));
    for (const [id, igne] of igneler) if (!olmali.has(id)) { igne.remove(); igneler.delete(id); }
    const harf = kategoriler[durum.kategori].simge || kategoriler[durum.kategori].ad.trim().charAt(0).toLocaleUpperCase(TR);
    for (const [id, m] of olmali) {
      if (igneler.has(id)) continue;
      const igne = L.marker([m.konum.lat, m.konum.lng], {
        keyboard: true, riseOnHover: true,
        icon: L.divIcon({ className: 'igne', html: el('span', { class: 'levha', text: harf }), iconSize: [30, 40], iconAnchor: [15, 40] }),
      }).addTo(harita);
      igne.bindTooltip(m.ad, { direction: 'top', offset: [0, -42] });
      igne.on('click', () => sec(id, 'harita'));
      const e = igne.getElement();
      e.setAttribute('aria-label', m.ad);
      e.dataset.id = id;
      igneler.set(id, igne);
    }
  }

  function koordinatAraciKur() {
    let acik = false, nokta = null;
    const dugme = el('button', { type: 'button', class: 'koor-dugme', 'aria-pressed': 'false', text: 'Koordinat al' });
    const Arac = L.Control.extend({
      options: { position: 'topright' },
      onAdd() { const kap = el('div', { class: 'leaflet-bar' }, dugme); L.DomEvent.disableClickPropagation(kap); return kap; },
    });
    new Arac().addTo(harita);
    dugme.addEventListener('click', () => {
      acik = !acik;
      dugme.setAttribute('aria-pressed', String(acik));
      dugme.textContent = acik ? 'Haritada bir yere tıkla' : 'Koordinat al';
      harita.getContainer().classList.toggle('koor-modu', acik);
      if (!acik) { $('#koorKutu').hidden = true; if (nokta) { nokta.remove(); nokta = null; } }
    });
    harita.on('click', e => {
      if (!acik) return;
      const metin = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
      $('#koorDeger').textContent = metin;
      $('#koorKutu').hidden = false;
      if (nokta) nokta.setLatLng(e.latlng);
      else nokta = L.marker(e.latlng, { interactive: false, keyboard: false, icon: L.divIcon({ className: 'koor-nokta', iconSize: [12, 12] }) }).addTo(harita);
    });
    $('#koorKopya').addEventListener('click', () => kopyala($('#koorDeger').textContent, $('#koorKopya'), $('#koorDeger')));
  }

  /* ---------- seçim: liste ve harita birlikte ---------- */
  function sec(id, kaynak) {
    if (kaynak === 'liste' && durum.secili === id) id = null;   // açık karta ikinci tık kapatır
    durum.secili = id;
    seciliyiUygula();
    if (!id) return;
    const igne = igneler.get(id);
    if (kaynak === 'liste' && igne && harita) {
      harita.setView(igne.getLatLng(), Math.max(harita.getZoom(), 15), { animate: !azHareket });
    }
    if (kaynak === 'harita') {
      const k = kok.querySelector(`.kart[data-id="${id}"]`);
      if (k) k.scrollIntoView({ block: 'nearest', behavior: azHareket ? 'auto' : 'smooth' });
    }
  }

  function seciliyiUygula() {
    for (const k of kok.querySelectorAll('.kart')) {
      const s = k.dataset.id === durum.secili;
      k.classList.toggle('secili', s);
      k.querySelector('.kart-bas').setAttribute('aria-expanded', String(s));
      k.querySelector('.ayrinti').hidden = !s;
    }
    for (const [id, igne] of igneler) {
      const s = id === durum.secili;
      igne.getElement().classList.toggle('secili', s);
      igne.setZIndexOffset(s ? 1000 : 0);
    }
  }

  /* ---------- ana döngü ---------- */
  function guncelle() {
    const tum = bolgeMekanlari();
    const uyan = [], belirsiz = [];
    for (const m of tum) {
      const d = degerlendir(m, durum.secimler);
      if (d.sonuc === 'uyar') uyan.push(m);
      else if (d.sonuc === 'belirsiz') belirsiz.push({ m, eksik: d.eksik });
    }
    if (durum.secili && !uyan.some(m => m.id === durum.secili) && !belirsiz.some(b => b.m.id === durum.secili)) durum.secili = null;
    paneliEsle(tum);
    listeyiCiz(tum, uyan, belirsiz);
    igneleriCiz(uyan);
    seciliyiUygula();
  }

  function filtreleriTemizle() {
    durum.secimler = {};
    guncelle();
  }

  function baglamiYaz() {
    const kat = kategoriler[durum.kategori];
    $('#baglam').textContent = `${durum.ilce} · ${kat.ad}`;
    const not = $('#kaynakNotu');   // kategoriye özel açıklama, tanımdan gelir
    not.textContent = kat.bilgi_notu || '';
    not.hidden = !kat.bilgi_notu;
  }

  /* ---------- çekmece (dar ekranda filtre paneli) ---------- */
  const dar = window.matchMedia('(max-width: 1099.98px)');
  const panel = $('#panel');
  function paneliAyarla(acik, odakla) {
    const cekmece = dar.matches;
    const gorunur = cekmece && acik;
    panel.classList.toggle('acik', gorunur);
    panel.inert = cekmece && !acik;
    $('#perde').hidden = !gorunur;
    $('#filtreAc').setAttribute('aria-expanded', String(gorunur));
    if (cekmece) { panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-modal', 'true'); }
    else { panel.removeAttribute('role'); panel.removeAttribute('aria-modal'); }
    for (const b of [$('.ust'), $('#sonuclar'), $('.harita-kap')]) b.inert = gorunur;
    if (odakla) (gorunur ? $('#panelKapat') : $('#filtreAc')).focus();
  }

  /* ---------- başlat ---------- */
  async function baslat() {
    try {
      ({ kategoriler, mekanlar, sinirlar } = await veriyiGetir());
    } catch (hata) {
      $('#sonucSayi').textContent = 'Veri yüklenemedi';
      const not = $('#sonucNot');
      not.textContent = 'Sayfayı yenileyip yeniden dene.';
      not.hidden = false;
      console.error(hata);
      return;
    }
    const bolgeler = [...new Map(mekanlar.map(m => [`${m.il}|${m.ilce}`, m])).values()]
      .sort((a, b) => `${a.il} ${a.ilce}`.localeCompare(`${b.il} ${b.ilce}`, TR));
    const bolgeSec = $('#bolgeSec'), kategoriSec = $('#kategoriSec');
    bolgeSec.replaceChildren(...bolgeler.map(m => el('option', { value: `${m.il}|${m.ilce}`, text: `${m.il} · ${m.ilce}` })));
    kategoriSec.replaceChildren(...Object.entries(kategoriler).map(([k, v]) => el('option', { value: k, text: v.ad })));
    [durum.il, durum.ilce] = bolgeSec.value.split('|');
    durum.kategori = kategoriSec.value;

    bolgeSec.addEventListener('change', () => {
      [durum.il, durum.ilce] = bolgeSec.value.split('|');
      durum.secili = null;
      baglamiYaz(); bolgeyiCiz(); guncelle();
    });
    kategoriSec.addEventListener('change', () => {
      durum.kategori = kategoriSec.value;
      durum.secimler = {}; durum.secili = null;
      baglamiYaz(); filtreleriCiz(); guncelle();
    });
    $('#temizle').addEventListener('click', filtreleriTemizle);
    $('#filtreAc').addEventListener('click', () => paneliAyarla(true, true));
    $('#panelKapat').addEventListener('click', () => paneliAyarla(false, true));
    $('#panelUygula').addEventListener('click', () => paneliAyarla(false, true));
    $('#perde').addEventListener('click', () => paneliAyarla(false, true));
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('acik')) paneliAyarla(false, true); });
    dar.addEventListener('change', () => paneliAyarla(false, false));

    paneliAyarla(false, false);
    baglamiYaz();
    filtreleriCiz();
    haritaKur();
    guncelle();
  }
  baslat();
})();
</script>
</body>
</html>
