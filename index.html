      harita.setView([m.konum.lat, m.konum.lng], Math.max(harita.getZoom(), 16), { animate: !azHareket });
      return true;
    }
    if (!k || !harita || !harita.getContainer().offsetWidth) return false;
    // Kümeleme 16. yakınlıkta kalktığı için o yakınlıkta iğne her zaman tek başına görünür. (Kümelemenin zoomToShowLayer'ı
    // kullanılmaz: iğne bu arada haritadan kalkarsa bekleyen işi her harita hareketinde hata veriyordu.)
    kullaniciAni = 0;
    harita.setView(k.igne.getLatLng(), Math.max(harita.getZoom(), 16), { animate: !azHareket });
    return true;
  }

  function seciliyiUygula() {
    for (const k of kok.querySelectorAll('.kart')) {
      const s = k.dataset.id === durum.secili;
      k.classList.toggle('secili', s);
    }
    for (const [id, k] of igneler) {
      const s = id === durum.secili;
      if (k.secili !== s) {
        // Simge değiştirilir (sınıf değil): iğne kümeden çıkıp yeniden çizilse de seçili görünür.
        k.igne.setIcon(igneIkonu(k.harf, s));
        k.secili = s;
        igneyiEtiketle(k);
      }
      k.igne.setZIndexOffset(s ? 1000 : 0);
    }
  }

  /* ---------- ana döngü ---------- */
  let sonHaritaAnahtari = '';
  let bolgeBilgi = { durum: 'tamam' };   // büyük kategoride seçili bölgenin yükleme durumu (bkz. bolgeHazirla)
  function guncelle() {
    gorunumuYaz();
    const kume = gorunumKumesi();
    bolgeBilgi = kume ? { durum: 'tamam' } : bolgeHazirla();
    // Liste görünümü: listedeki bütün kayıtlar, kategori ve şehir ayırmadan; filtreler uygulanmaz.
    const tum = kume ? kumedekiler(kume).filter(m => kategoriler[m.kategori]).sort((a, b) => a.ad.localeCompare(b.ad, TR)) : bolgeMekanlari();
    document.querySelector('.panel .ikili').hidden = !!kume;
    $('#filtreler').hidden = !!kume;
    baglamiYaz(tum);
    const haritaAnahtari = kume ? `L:${tum.map(m => m.id).join(',')}` : '';
    if (haritaAnahtari !== sonHaritaAnahtari) { sonHaritaAnahtari = haritaAnahtari; bolgeyiCiz(); }
    const uyan = [], belirsiz = [];
    for (const m of tum) {
      const d = kume ? { sonuc: 'uyar', eksik: [] } : degerlendir(m, durum.secimler);
      if (d.sonuc === 'uyar') uyan.push(m);
      else if (d.sonuc === 'belirsiz') belirsiz.push({ m, eksik: d.eksik });
    }
    if (durum.secili && !uyan.some(m => m.id === durum.secili) && !belirsiz.some(b => b.m.id === durum.secili)) durum.secili = null;
    // Sıralama seçimi: puan, yakınlık ya da ad. Puanlaması kapalı kategoride puan, konum yokken yakınlık ada düşer.
    const puanVar = kume ? tum.some(m => puanlamaAcik(m.kategori)) : puanlamaAcik(durum.kategori);
    const sira = siralayici(etkinSiralama(durum.siralama, puanVar));
    uyan.sort(sira);
    belirsiz.sort((a, b) => sira(a.m, b.m));
    const ss = $('#siralaSec');
    ss.options[0].disabled = !puanVar;
    ss.options[1].disabled = !yakinlikMumkun();
    ss.value = durum.siralama === 'puan' && !puanVar ? 'ad' : durum.siralama === 'yakinlik' && !yakinlikMumkun() ? 'ad' : durum.siralama;
    if (!kume) paneliEsle(tum);
    listeyiCiz(tum, uyan, belirsiz);
    igneleriCiz(uyan);
    alaniCiz();
    seciliyiUygula();
    if (durum.sekme === 'kesfet') kesfetCiz();
    if (durum.sayfa) {   // açık sayfadaki liste ve favori düğmeleri güncel kalsın (ör. liste penceresi kapanınca)
      const m = mekanBul(durum.sayfa), yer = $('#msEylem');
      if (m && yer) yer.replaceChildren(...sayfaEylemleri(m));
    }
  }

  function filtreleriTemizle() {
    durum.secimler = {};
    durum.gorunum = '';
    durum.alan = null;
    guncelle();
  }

  // Kategoriye özel dış bağlantılar (ör. eczanede resmi nöbetçi listesi). Tanım: kategoriler.json'da
  // "baglantilar": [{ il?, etiket, kaynak?, adres }]; "il" verilmişse yalnızca o ilde gösterilir.
  // Bağlantı yalnızca yönlendirir: oradaki bilgi bu sayfaya kopyalanmaz.
  function kategoriBaglantilari(katAdi, il) {
    const kat = kategoriler[katAdi];
    return ((kat && kat.baglantilar) || [])
      .filter(b => b && /^https:\/\//.test(b.adres || '') && b.etiket && (!b.il || b.il === il))
      .map(b => el('a', { href: b.adres, target: '_blank', rel: 'noopener noreferrer' },
        el('span', null, b.etiket, b.kaynak ? el('span', { class: 'kb-kaynak', text: `${b.kaynak} sitesinde açılır` }) : null),
        el('span', { class: 'kb-ok', 'aria-hidden': 'true', text: '↗' })));
  }

  function baglamiYaz(listedekiler) {
    const not = $('#kaynakNotu');   // kategoriye özel açıklama, tanımdan gelir
    const bagKutu = $('#katBaglanti');
    const baglar = durum.gorunum ? [] : kategoriBaglantilari(durum.kategori, durum.il);
    bagKutu.replaceChildren(...baglar);
    bagKutu.hidden = !baglar.length;
    if (durum.gorunum) {   // liste görünümü: listedeki her kategorinin notu
      $('#baglam').textContent = gorunumAdi();
      const notlar = [...new Set((listedekiler || []).map(m => kategoriler[m.kategori].bilgi_notu).filter(Boolean))];
      not.replaceChildren(...notlar.map(n => el('span', { class: 'not-satiri', text: n })));
      not.hidden = !notlar.length;
      return;
    }
    const kat = kategoriler[durum.kategori];
    $('#baglam').textContent = `${bolgeAdi()} · ${kat.ad}`;
    not.textContent = kat.bilgi_notu || '';
    not.hidden = !kat.bilgi_notu;
  }

  /* ---------- ziyaretçinin konumu ---------- */
  // Konum yalnızca bu sayfada, tarayıcının içinde kullanılır: hiçbir sunucuya gönderilmez, kaydedilmez.
  // İzin, ziyaretçi "Konumum" düğmesine basınca istenir. Sayfa açıkken konum canlı güncellenir.
  const konum = { aktif: false, izleme: null, son: null, ilk: true, listeKonumu: null, nokta: null, daire: null, dugme: null, zamanlayici: null };

  function uzaklik(a, b) {   // kuş uçuşu, metre
    const R = 6371000, r = x => (x * Math.PI) / 180;
    const h = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lng - a.lng) / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const uzaklikYaz = m => (m < 975 ? `${Math.max(50, Math.round(m / 50) * 50)} m`
    : m < 9950 ? `${(m / 1000).toFixed(1).replace('.', ',')} km` : `${Math.round(m / 1000)} km`);

  function konumMesaji(metin, sure) {
    const n = $('#konumNot');
    clearTimeout(konum.zamanlayici);
    n.textContent = metin || '';
    n.hidden = !metin;
    if (metin && sure) konum.zamanlayici = setTimeout(() => { n.hidden = true; }, sure);
  }

  function halkaIcinde(x, y, h) {
    let ic = false;
    for (let i = 0, j = h.length - 1; i < h.length; j = i++) {
      const [x1, y1] = h[i], [x2, y2] = h[j];
      if ((y1 > y) !== (y2 > y) && x < ((x2 - x1) * (y - y1)) / (y2 - y1) + x1) ic = !ic;
    }
    return ic;
  }
  // Noktanın bulunduğu il ve ilçe (sınır verisi olan iller içinde).
  function yerBul(lat, lng) {
    for (const f of sinirlar.features) {
      if (f.properties.tur !== 'ilce') continue;
      const g = f.geometry;
      for (const c of g.type === 'MultiPolygon' ? g.coordinates : [g.coordinates]) {
        if (halkaIcinde(lng, lat, c[0]) && !c.slice(1).some(d => halkaIcinde(lng, lat, d))) return { il: f.properties.il, ilce: f.properties.ad };
      }
    }
    // Sınırı yüklenmemiş il ya da kıyı/su: ilin kutusu yeter (kutular örtüşebilir; en küçüğü seçilir).
    let enIyi = null, enKucuk = Infinity;
    for (const [il, v] of Object.entries(sinirlar.iller || {})) {
      const [b, g, d, n] = v.kutu || [];
      if (lng >= b && lng <= d && lat >= g && lat <= n && (d - b) * (n - g) < enKucuk) { enIyi = il; enKucuk = (d - b) * (n - g); }
    }
    if (enIyi) { ilSinirYukle(enIyi); return { il: enIyi, ilce: null }; }
    return null;
  }

  function konumDugmesiKur() {
    if (!('geolocation' in navigator) || !window.isSecureContext) return;   // desteklenmiyorsa düğme hiç çıkmaz
    const Konum = L.Control.extend({
      options: { position: 'bottomright' },
      onAdd() {
        const kap = el('div', { class: 'leaflet-bar' });
        konum.dugme = el('button', { type: 'button', class: 'konum-dugme', 'aria-pressed': 'false', title: 'Konumumu göster (yalnızca bu cihazda kullanılır)', 'aria-label': 'Konumumu göster' }, simge('konum'));
        konum.dugme.addEventListener('click', () => (konum.aktif ? konumuKapat() : konumuAc()));
        L.DomEvent.disableClickPropagation(kap);
        kap.append(konum.dugme);
        return kap;
      },
    });
    new Konum().addTo(harita);
    // Sekme arka plana geçince izleme durur (pil), öne gelince sürer.
    document.addEventListener('visibilitychange', () => {
      if (!konum.aktif) return;
      if (document.hidden) izlemeyiDurdur(); else izlemeyiBaslat();
    });
  }

  function izlemeyiBaslat() {
    if (konum.izleme !== null) return;
    konum.izleme = navigator.geolocation.watchPosition(konumGeldi, konumHatasi, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
  }
  function izlemeyiDurdur() {
    if (konum.izleme !== null) navigator.geolocation.clearWatch(konum.izleme);
    konum.izleme = null;
  }

  function konumuAc() {
    konum.aktif = true;
    if (!durum.siralamaElle) durum.siralama = 'yakinlik';   // ziyaretçi seçmediyse konum açılınca en yakın üstte
    konum.ilk = true;
    konum.dugme.setAttribute('aria-pressed', 'true');
    konum.dugme.classList.add('bekliyor');
    konumMesaji('Konumun bulunuyor…');
    izlemeyiBaslat();
  }

  function konumuKapat(not) {
    izlemeyiDurdur();
    konum.aktif = false;
    konum.son = null;
    if (!durum.siralamaElle && durum.siralama === 'yakinlik') durum.siralama = 'puan';
    konum.listeKonumu = null;
    for (const k of ['nokta', 'daire']) if (konum[k]) { konum[k].remove(); konum[k] = null; }
    if (konum.dugme) {
      konum.dugme.setAttribute('aria-pressed', 'false');
      konum.dugme.classList.remove('bekliyor');
    }
    konumMesaji(not || '', not ? 9000 : 0);
    guncelle();
  }

  function konumGeldi(p) {
    if (!konum.aktif) return;
    const yeni = { lat: p.coords.latitude, lng: p.coords.longitude };
    const dogruluk = Math.min(p.coords.accuracy || 0, 5000);
    konum.son = yeni;
    konum.dugme.classList.remove('bekliyor');
    if (!konum.nokta) {
      konum.daire = L.circle([yeni.lat, yeni.lng], { radius: dogruluk, className: 'konum-daire', interactive: false }).addTo(harita);
      konum.nokta = L.marker([yeni.lat, yeni.lng], {
        interactive: false, keyboard: false, zIndexOffset: 2000,
        icon: L.divIcon({ className: 'konum-nokta', html: el('span'), iconSize: [18, 18], iconAnchor: [9, 9] }),
      }).addTo(harita);
    } else {
      konum.nokta.setLatLng([yeni.lat, yeni.lng]);
      konum.daire.setLatLng([yeni.lat, yeni.lng]).setRadius(dogruluk);
    }
    if (konum.ilk) {
      konum.ilk = false;
      const yer = yerBul(yeni.lat, yeni.lng);
      const ilSec = $('#ilSec');
      if (yer && yer.il !== durum.il && [...ilSec.options].some(o => o.value === yer.il)) {   // başka bir ildeysen o ilin tamamına geçilir
        ilSec.value = yer.il;
        ilSec.dispatchEvent(new Event('change'));
      }
      if (yer) harita.setView([yeni.lat, yeni.lng], Math.max(harita.getZoom(), 14), { animate: !azHareket });
      konumMesaji(yer ? 'Konumun yalnızca bu cihazda kullanılır, kaydedilmez.'
        : 'Bulunduğun yer, haritası açık illerin dışında. Sonuçlar yine de sana yakınlığa göre sıralı.', 7000);
    }
    // Liste her küçük kıpırtıda değil, 100 metreden fazla yer değişince yeniden sıralanır.
    if (!konum.listeKonumu || uzaklik(konum.listeKonumu, yeni) > 100) {
      konum.listeKonumu = yeni;
      guncelle();
    }
  }

  function konumHatasi(h) {
    if (!konum.aktif) return;
    if (h.code !== 1 && konum.son) return;   // konum bir kez bulunduysa geçici hatalarda son konumla devam edilir
    const not = h.code === 1 ? 'Konum izni verilmedi. İstersen tarayıcı ayarlarından bu siteye konum izni verebilirsin.'
      : h.code === 2 ? 'Konumun bulunamadı. Cihazında konum servislerinin açık olduğundan emin ol.'
      : 'Konum zamanında alınamadı. Yeniden dene.';
    konumuKapat(not);
  }

  /* ---------- sekmeler: Harita | Keşfet ---------- */
  function sekmeyeGec(s) {
    durum.sekme = s;
    kok.classList.toggle('kesfette', s === 'kesfet');
    $('#kesfet').hidden = s !== 'kesfet';
    for (const b of kok.querySelectorAll('[data-sekme]')) {
      if (b.dataset.sekme === s) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    }
    $('#panelUygula').textContent = s === 'kesfet' ? 'Keşfet\'e dön' : 'Sonuçları göster';
    if (s === 'kesfet') {
      sayacGetir(sayac.favori); sayacGetir(sayac.eklenme); sayacGetir(sayac.puan);
      kesfetCiz();
    } else if (harita) {
      harita.invalidateSize({ pan: false });
      guncelle();
    }
  }

  /* ---------- keşfet ---------- */
  // Raflar, harita sekmesindeki seçimle (il, ilçe ya da taranan alan, kategori, filtreler) aynı kümeden çizilir:
  // yalnızca filtrelere kesin uyan kayıtlar. Liste görünümü (Favorilerim vb.) Keşfet'i etkilemez.
  const RAF_ADIM = 10;
  const rafSiniri = { favori: RAF_ADIM, yeni: RAF_ADIM, puan: RAF_ADIM, arama: 30, kapsam: '' };
  const kapsamUyanlar = () => bolgeMekanlari().filter(m => degerlendir(m, durum.secimler).sonuc === 'uyar');
  const kategoriHarfi = k => kategoriler[k].simge || kategoriler[k].ad.trim().charAt(0).toLocaleUpperCase(TR);
  const aySiz = new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'short' });
  const ayYil = new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
  const kisaTarih = ms => (new Date(ms).getFullYear() === new Date().getFullYear() ? aySiz : ayYil).format(ms);

  function satir(m, sol, olcu, raf) {
    const uzak = konum.son && m.konum ? uzaklik(konum.son, m.konum) : null;
    const ac = el('button', { class: 'satir-ac', type: 'button' }, sol,
      el('span', { class: 'satir-govde' },
        el('span', { class: 'satir-ad', text: m.ad }),
        el('span', { class: 'satir-alt' },
          uzak != null ? el('span', { class: 'uzaklik', title: 'Kuş uçuşu uzaklık' }, uzaklikYaz(uzak)) : null,
          puanOzeti(m) && raf !== 'puan' ? el('span', { class: 'satir-puan', title: `${puanOzeti(m).sayi} puan` }, simge('yildiz'), `${virgul(puanOzeti(m).ort)} · `) : null,
          `${kategoriler[m.kategori].ad} · ${m.ilce}, ${m.il}`)),
      olcu);
    ac.addEventListener('click', () => mekanSayfasiniAc(m, { kaynak: raf === 'yakin' ? 'yakin' : 'kesfet' }));
    return el('li', { class: 'satir', 'data-id': m.id, 'data-raf': raf }, ac, favoriDugmesi(m));
  }
  const levhaSol = (metin, ek) => el('span', { class: `levha satir-sol${ek ? ` ${ek}` : ''}`, 'aria-hidden': 'true', text: metin });
  function dahaDugmesi(anahtar, kalan) {
    const b = el('button', { class: 'dugme raf-daha', type: 'button', text: `${Math.min(kalan, RAF_ADIM)} tane daha göster` });
    b.addEventListener('click', () => { rafSiniri[anahtar] += anahtar === 'arama' ? 30 : RAF_ADIM; kesfetCiz(); });
    return b;
  }
  function raf(baslik, not, govde) {
    return el('section', { class: 'raf', 'aria-label': baslik }, el('h2', { class: 'raf-baslik', text: baslik }), not ? el('p', { class: 'raf-not', text: not }) : null, govde);
  }

  function kesfetCiz() {
    if (!mekanlar) return;
    // Yıldıza basınca raf yeniden çizilir; odak aynı kaydın yıldızında kalır.
    const odak = document.activeElement;
    const odakSatiri = odak && odak.classList && odak.classList.contains('favori') && odak.closest('.satir');
    const odakAnahtari = odakSatiri ? [odakSatiri.dataset.raf, odakSatiri.dataset.id] : null;

    const q = $('#aramaGir').value.trim();
    const arama = duz(q).length >= 2;
    $('#aramaSonuc').hidden = !arama;
    $('#raflar').hidden = arama;
    if (arama) aramayiCiz(q); else raflariCiz();

    if (odakAnahtari) {
      const yeni = kok.querySelector(`.satir[data-raf="${odakAnahtari[0]}"][data-id="${odakAnahtari[1]}"] .favori`);
      if (yeni) yeni.focus();
    }
  }

  function raflariCiz() {
    const uyan = kapsamUyanlar();
    const kat = kategoriler[durum.kategori];
    const filtreSayisi = filtreler().reduce((n, f) => n + (aktifMi(f, durum.secimler[f.alan]) ? (f.tip === 'coklu' ? durum.secimler[f.alan].size : 1) : 0), 0);
    const kapsamAnahtari = `${durum.il}|${durum.ilce}|${durum.kategori}|${!!durum.alan}|${uyan.length}|${filtreSayisi}`;
    if (kapsamAnahtari !== rafSiniri.kapsam) { rafSiniri.kapsam = kapsamAnahtari; rafSiniri.favori = RAF_ADIM; rafSiniri.yeni = RAF_ADIM; rafSiniri.puan = RAF_ADIM; }

    const degistir = el('button', { class: 'bag', type: 'button', text: 'Değiştir' });
    degistir.addEventListener('click', () => { if (dar.matches) paneliAyarla(true, true); else $('#ilSec').focus(); });
    const yer = durum.alan ? `Haritadaki alan (${durum.il})` : durum.ilce === TUM ? `Tüm ${durum.il}` : `${durum.ilce}, ${durum.il}`;
    const kapsam = el('div', { class: 'kapsam' },
      el('p', null, el('span', { class: 'baslik-kucuk', text: 'Seçimin' }),
        [yer, kat.ad, filtreSayisi ? `${filtreSayisi} filtre` : null, `${uyan.length} yer`].filter(Boolean).join(' · ')),
      degistir);

    // En çok favorilenenler
    const fs = sayac.favori;
    let favGovde;
    if (!fs.harita) {
      favGovde = el('p', { class: 'raf-bos', text: fs.durum === 'hata' ? 'Favori sayıları şu an alınamadı. Sayfayı yenileyip yeniden dene.' : 'Favori sayıları yükleniyor…' });
    } else {
      const sirali = uyan.filter(m => (fs.harita.get(m.id) || 0) > 0)
        .sort((a, b) => fs.harita.get(b.id) - fs.harita.get(a.id) || a.ad.localeCompare(b.ad, TR));
      favGovde = sirali.length
        ? [el('ol', { class: 'satirlar' }, sirali.slice(0, rafSiniri.favori).map((m, i) => {
          const n = fs.harita.get(m.id);
          return satir(m, levhaSol(String(i + 1)),
            el('span', { class: 'olcu fav', title: `${n} kişi favoriledi` }, simge('yildiz'), el('span', { class: 'gorunmez', text: 'Favori sayısı: ' }), String(n)), 'favori');
        })), sirali.length > rafSiniri.favori ? dahaDugmesi('favori', sirali.length - rafSiniri.favori) : null]
        : el('p', { class: 'raf-bos', text: 'Bu seçimde henüz favorilenen yer yok. Bir yeri favoriye almak için yanındaki yıldıza bas.' });
    }

    // Son eklenenler
    const es = sayac.eklenme;
    let yeniGovde;
    if (!es.harita) {
      yeniGovde = el('p', { class: 'raf-bos', text: es.durum === 'hata' ? 'Eklenme tarihleri şu an alınamadı. Sayfayı yenileyip yeniden dene.' : 'Yükleniyor…' });
    } else {
      const sirali = uyan.filter(m => Number.isFinite(es.harita.get(m.id)))
        .sort((a, b) => es.harita.get(b.id) - es.harita.get(a.id) || a.ad.localeCompare(b.ad, TR));
      yeniGovde = sirali.length
        ? [el('ol', { class: 'satirlar' }, sirali.slice(0, rafSiniri.yeni).map(m => satir(m, levhaSol(kategoriHarfi(m.kategori), 'harf'),
          el('span', { class: 'olcu', title: 'Keşif\'e eklendiği gün' }, el('span', { class: 'gorunmez', text: 'Eklendi: ' }), kisaTarih(es.harita.get(m.id))), 'yeni'))),
        sirali.length > rafSiniri.yeni ? dahaDugmesi('yeni', sirali.length - rafSiniri.yeni) : null]
        : el('p', { class: 'raf-bos', text: 'Bu seçimde kayıt yok.' });
    }

    // En yüksek puanlılar: ağırlıklı puana göre (en az bir puanı olanlar)
    const ps = sayac.puan;
    let puanGovde;
    if (!puanlamaAcik(durum.kategori)) puanGovde = el('p', { class: 'raf-bos', text: `${kat.ad} kategorisinde puanlama yok.` });
    else if (!ps.harita) puanGovde = el('p', { class: 'raf-bos', text: ps.durum === 'hata' ? 'Puanlar şu an alınamadı. Sayfayı yenileyip yeniden dene.' : 'Puanlar yükleniyor…' });
    else {
      const sirali = uyan.filter(m => puanSkoru(m) != null).sort(siralayici('puan'));
      puanGovde = sirali.length
        ? [el('ol', { class: 'satirlar' }, sirali.slice(0, rafSiniri.puan).map((m, i) => {
          const p = puanOzeti(m);
          return satir(m, levhaSol(String(i + 1)),
            el('span', { class: 'olcu fav', title: `${p.sayi} puan, ortalama ${virgul(p.ort)}` }, simge('yildiz'),
              el('span', { class: 'gorunmez', text: 'Ortalama puan: ' }), virgul(p.ort), el('span', { class: 'olcu-ek', text: ` · ${p.sayi}` })), 'puan');
        })), sirali.length > rafSiniri.puan ? dahaDugmesi('puan', sirali.length - rafSiniri.puan) : null]
        : el('p', { class: 'raf-bos', text: 'Bu seçimde henüz puanlanan yer yok. Bir yerin sayfasından puan verebilirsin.' });
    }

    const bb = bolgeHazirla();
    if (bb.durum !== 'tamam') { $('#raflar').replaceChildren(kapsam, el('ul', { class: 'raflar-bolge' }, bolgeDurumKutusu(bb))); return; }
    $('#raflar').replaceChildren(
      kapsam,
      raf('En yüksek puanlılar', 'Ortalama puana ve puan sayısına göre; az puanlı yerler öne geçmesin diye ağırlıklı.', puanGovde),
      raf('En çok favorilenenler', 'Ziyaretçilerin favorilerine göre. Senin favorilerin de sayıma adsız olarak girer.', favGovde),
      raf('Son eklenenler', 'Keşif\'e en son eklenen yerler.', yeniGovde));
  }

  /* ---------- arama ---------- */
  // Bütün il ve kategorilerde ad, ilçe, il ve adrese bakar (Türkçe harf ve büyük/küçük harf fark etmez).
  // Ayrıca kategori adlarına ve filtre seçeneklerine (marka, branş, özellik) bakıp filtre önerir.
  let aramaDizini = null;
  function dizinKur() {
    aramaDizini = mekanlar.filter(m => kategoriler[m.kategori])
      .map(m => ({ m, ad: duz(m.ad), hepsi: duz(`${m.ad} ${m.ilce} ${m.il} ${m.adres || ''} ${bilgiler(m.kategori).filter(b => b.aranir).map(b => m.ozellikler[b.alan] || '').join(' ')}`) }));
  }
  const kelimeBasi = (metin, q) => metin.startsWith(q) || metin.includes(` ${q}`);
  function eslesir(m, o) {
    if (o.tur === 'kategori') return m.kategori === o.k;
    const v = m.kategori === o.k ? m.ozellikler[o.f.alan] : undefined;
    if (o.f.tip === 'coklu') return Array.isArray(v) && v.includes(o.deger);
    if (o.f.tip === 'secim') return v === o.deger;
    return v === true;
  }
  // Bir önerinin kayıt sayısı (il verilirse o ilde). Büyük kategorilerde sayılar veritabanındaki sayımdan gelir.
  function oneriSayisi(o, il) {
    if (bolgeselMi(o.k)) {
      let n = 0;
      if (o.tur === 'kategori') {
        for (const [a, v] of bolge.sayim) { const [k, i] = a.split('|'); if (k === o.k && (!il || i === il)) n += v; }
        return n;
      }
      const d = o.f.tip === 'evet_hayir' ? 'true' : String(o.deger);
      for (const [a, v] of bolge.secenekSayim) {
        const [k, i, al, dg] = a.split('|');
        if (k === o.k && al === o.f.alan && dg === d && (!il || i === il)) n += v;
      }
      return n;
    }
    return mekanlar.filter(m => eslesir(m, o) && (!il || m.il === il)).length;
  }
  function oneriBul(q) {
    const adaylar = [];
    for (const [k, kat] of Object.entries(kategoriler)) {
      if (k === TUMU) continue;
      const ad = duz(kat.ad);
      if (kelimeBasi(ad, q)) adaylar.push({ tur: 'kategori', k, etiket: kat.ad, puan: ad.startsWith(q) ? 0 : 1 });
      if (q.length < 3) continue;   // tek iki harfle filtre önerisi çok gürültülü olur (tam eşleşme hariç)
      for (const f of kat.filtreler) {
        if (f.tip === 'evet_hayir') {
          const e = duz(f.etiket);
          if (kelimeBasi(e, q)) adaylar.push({ tur: 'filtre', k, f, deger: true, etiket: f.etiket, puan: e === q ? 0 : 1 });
        } else {
          for (const s of f.secenekler) {
            const e = duz(s.etiket);
            if (e === q || kelimeBasi(e, q)) adaylar.push({ tur: 'filtre', k, f, deger: s.deger, etiket: s.etiket, puan: e === q ? 0 : e.startsWith(q) ? 1 : 2 });
          }
        }
      }
    }
    return adaylar.sort((a, b) => a.puan - b.puan).slice(0, 25)
      .map(o => ({ ...o, n: oneriSayisi(o) }))
      .filter(o => o.n > 0)
      .sort((a, b) => a.puan - b.puan || b.n - a.n)
      .slice(0, 5);
  }
  function aramayiCiz(ham) {
    if (!aramaDizini) dizinKur();
    const q = duz(ham), parcalar = q.split(' ');
    uzakAra(q);   // büyük kategoriler sunucuda aranır; sonuç gelince bu ekran yeniden çizilir
    if (rafSiniri.aramaMetni !== q) { rafSiniri.aramaMetni = q; rafSiniri.arama = 30; }
    const puan = d => (d.ad.startsWith(q) ? 0 : kelimeBasi(d.ad, q) ? 1 : d.ad.includes(q) ? 2 : 3);
    const uzak = m => (konum.son && m.konum ? uzaklik(konum.son, m.konum) : Infinity);
    const kk = aramaKategorisi();   // kategori seçiliyse arama o kategoride yapılır
    const bulunan = aramaDizini.filter(d => (!kk || d.m.kategori === kk) && parcalar.every(p => d.hepsi.includes(p)))
      .map(d => ({ m: d.m, p: puan(d) }))
      .sort((a, b) => a.p - b.p || uzak(a.m) - uzak(b.m) || a.m.ad.localeCompare(b.m.ad, TR));
    // Aramada sıralama: en iyi eşleşme (varsayılan), puan ya da yakınlık.
    const aramaPuanVar = bulunan.some(({ m }) => puanlamaAcik(m.kategori));
    const at = durum.aramaSiralama === 'eslesme' ? 'eslesme' : etkinSiralama(durum.aramaSiralama, aramaPuanVar);
    if (at !== 'eslesme' && at !== 'ad') { const s = siralayici(at); bulunan.sort((a, b) => s(a.m, b.m)); }
    const aramaSec = siralamaSecimi('aramaSirala', durum.aramaSiralama,
      [['eslesme', 'En iyi eşleşme'], ['puan', 'Puana göre', !aramaPuanVar], ['yakinlik', 'Yakınlığa göre', !yakinlikMumkun()]],
      v => { durum.aramaSiralama = v; rafSiniri.arama = 30; kesfetCiz(); const s = $('#aramaSirala'); if (s) s.focus(); });
    const oneriler = q.length >= 2 ? oneriBul(q) : [];

    const ogeler = [];
    if (oneriler.length) {
      ogeler.push(raf('Filtre önerileri', 'Seçince harita bu kategori ve filtreyle açılır.',
        el('ul', { class: 'satirlar' }, oneriler.map(o => {
          const kat = kategoriler[o.k];
          const ac = el('button', { class: 'satir-ac', type: 'button' }, levhaSol(kategoriHarfi(o.k), 'oneri'),
            el('span', { class: 'satir-govde' },
              el('span', { class: 'satir-ad', text: o.etiket }),
              el('span', { class: 'satir-alt', text: o.tur === 'kategori' ? 'Kategori' : `${kat.ad} · ${o.f.etiket}` })),
            el('span', { class: 'olcu', text: `${o.n} yer` }));
          ac.addEventListener('click', () => oneriUygula(o));
          return el('li', { class: 'satir' }, ac);
        }))));
    }
    const mekanBasligi = `Yerler`;
    // Kategori seçiliyken aramayı bütün kategorilere genişletmek için tek düğme ("Tümü"ye geçer).
    let kapsamSatiri = null;
    if (kk) {
      const genislet = el('button', { class: 'dugme', type: 'button', text: 'Bütün kategorilerde ara' });
      genislet.addEventListener('click', () => {
        const sec = $('#kategoriSec');
        sec.value = TUMU;
        sec.dispatchEvent(new Event('change'));
        kesfetCiz();
      });
      kapsamSatiri = el('p', { class: 'arama-ozet' }, `Arama seçili kategoride: ${kategoriler[kk].ad}. `, genislet);
    }
    const uzakSayi = bulunan.filter(({ m }) => bolgeselMi(m.kategori)).length;
    const uzakNotu = uzakArama.durum === 'yukleniyor' ? ' · büyük kategorilerde aranıyor…'
      : uzakArama.durum === 'hata' ? ' · büyük kategorilerde şu an aranamadı'
      : uzakSayi >= ARAMA_UST_SINIR ? ' · çok sonuç var, aramayı daraltabilirsin' : '';
    ogeler.push(raf(mekanBasligi, null, bulunan.length
      ? [kapsamSatiri, el('div', { class: 'arama-ust' }, el('p', { class: 'arama-ozet', text: `${bulunan.length} sonuç · ${kk ? `yalnızca ${kategoriler[kk].ad.toLocaleLowerCase(TR)} içinde` : 'bütün il ve kategorilerde'}${uzakNotu}${durum.aramaSiralama === 'yakinlik' && !konum.son ? ' · yakınlık için konumun bekleniyor' : ''}` }), bulunan.length > 1 ? aramaSec : null),
        el('ul', { class: 'satirlar' }, bulunan.slice(0, rafSiniri.arama).map(({ m }) => satir(m, levhaSol(kategoriHarfi(m.kategori), 'harf'), null, 'arama'))),
        bulunan.length > rafSiniri.arama ? dahaDugmesi('arama', bulunan.length - rafSiniri.arama) : null]
      : [kapsamSatiri, el('p', { class: 'raf-bos', text: uzakArama.durum === 'yukleniyor' ? 'Aranıyor…'
        : `“${ham}” adıyla, adresiyle ya da ilçesiyle eşleşen yer yok${kk ? ` (${kategoriler[kk].ad})` : ''}.${uzakNotu}${oneriler.length ? ' Yukarıdaki filtre önerilerine bakabilirsin.' : ''}` })]));
    $('#aramaSonuc').replaceChildren(...ogeler);
  }

  /* ---------- işletme sayfası ---------- */
  // Her kaydın kendi sayfası ve adresi var: <site>#mekan=<kimlik>. Paylaşılabilir, tarayıcının geri tuşu çalışır.
  // Sayfa kategori tanımından çizilir (kategoriye özel kod yok). İşletme sahibinin girdiği bilgiler ayrı bir katmandır,
  // "İşletme beyanı" etiketiyle gösterilir ve doğrulanmış bilgiyi hiçbir zaman değiştirmez.
  const sayfa = { donus: 'harita', odakGeri: null, sonra: null, ortalanacak: null, baslik: document.title, tamamen: false };
  const MEKAN_HASH = /^#mekan=([a-z0-9]+(?:-[a-z0-9]+)*)$/;
  const mekanHashi = () => { const e = location.hash.match(MEKAN_HASH); return e ? e[1] : null; };
  const mekanBul = id => mekanlar.find(m => m.id === id && kategoriler[m.kategori]);
  const mekanBaglantisi = id => `${location.href.split('#')[0]}#mekan=${id}`;

  // İşletme beyanı için tek giriş noktası. Sahiplenme ve hesaplar gelince veritabanından okunacak (bkz. claude/isletme-sayfasi.md).
  // Biçim: { aciklama, saatler: [{ gun, saat }], alanlar: [{ baslik, metin }], guncellenme }
  function beyanGetir(m) {
    const b = window.KESIF_BEYAN && window.KESIF_BEYAN[m.id];
    return b && typeof b === 'object' ? b : null;
  }

  // Kayıt haritadaki seçime uyuyorsa seçim korunur; uymuyorsa kaydın il ve kategorisine geçilir (filtreler temizlenir).
  function kapsamaAl(m) {
    const kume = gorunumKumesi();
    const icinde = kume ? kume.has(m.id)
      : tumuMu() ? m.il === durum.il && (durum.ilce === TUM || m.ilce === durum.ilce)   // "Tümü": harita kayda gider, mod korunur
      : m.il === durum.il && m.kategori === durum.kategori
        && (durum.alan ? alanda(m) : (durum.ilce === TUM || m.ilce === durum.ilce))
        && degerlendir(m, durum.secimler).sonuc !== 'uymaz';
    if (icinde) return;
    durum.gorunum = '';
    grubaGit(m.il, m.kategori, false);
    baglamiYaz(); filtreleriCiz(); bolgeyiCiz();
    guncelle();
  }

  // kaynak: 'liste' | 'harita' | 'kesfet' | 'yakin' | 'baglanti' | 'gecmis'. gecmis: tarayıcı geçmişine yeni adım eklensin mi.
  function mekanSayfasiniAc(m, { kaynak = 'liste', gecmis = true } = {}) {
    if (!m) return;
    if (!durum.sayfa) {
      sayfa.donus = durum.sekme;
      sayfa.odakGeri = document.activeElement;
    }
    if (kaynak !== 'harita') kapsamaAl(m);
    if (durum.sekme !== 'harita') sekmeyeGec('harita');
    durum.sayfa = m.id;
    durum.secili = m.id;
    kok.classList.add('sayfada');
    $('#mekanSayfa').hidden = false;
    if (dar.matches && panel.classList.contains('acik')) paneliAyarla(false, false);
    seciliyiUygula();
    mekanSayfasiniCiz(m);
    // derinlik: bu sayfa zincirinde kaçıncı sayfa (sekmeye basınca hepsi birden kapatılabilsin diye).
    if (gecmis && mekanHashi() !== m.id) history.pushState({ kesifMekan: m.id, derinlik: ((history.state && history.state.derinlik) || 0) + 1 }, '', `#mekan=${m.id}`);
    document.title = `${m.ad} · Keşif`;
    if (harita) harita.invalidateSize({ pan: false });
    // İğneye basılınca harita kıpırdamaz; başka yerden açılınca kayıt haritada ortalanır (telefonda harita gizliyse kapanınca).
    sayfa.ortalanacak = null;
    if (kaynak !== 'harita' && !haritadaOrtala(m.id)) sayfa.ortalanacak = m.id;
    $('#mekanSayfa').scrollTop = 0;
    $('#msAd').focus({ preventScroll: true });
  }

  // Kapatma tarayıcı geçmişiyle yapılır: sayfayı biz açtıysak bir adım geri gidilir (hashchange kapatır), bağlantıyla
  // gelindiyse adres temizlenir. sonra: kapandıktan sonra çalışacak iş (ör. başka sekmeye geçmek).
  // tamamen: art arda açılmış sayfaların hepsi kapanır (Harita/Keşfet sekmesi, Ara); yoksa yalnızca bir adım geri gidilir (← düğmesi, Esc).
  function sayfayiKapat(sonra, tamamen = false) {
    if (!durum.sayfa) { if (sonra) sonra(); return; }
    sayfa.sonra = sonra || null;
    const d = history.state && history.state.kesifMekan ? (tamamen ? history.state.derinlik || 1 : 1) : 0;
    if (d) { sayfa.tamamen = tamamen; history.go(-d); return; }
    history.replaceState(null, '', location.pathname + location.search);
    sayfaKapandi();
  }
  function sayfaKapandi() {
    if (!durum.sayfa) return;
    const id = durum.sayfa;
    durum.sayfa = null;
    kok.classList.remove('sayfada');
    $('#mekanSayfa').hidden = true;
    $('#mekanSayfa').replaceChildren();
    document.title = sayfa.baslik;
    const sonra = sayfa.sonra; sayfa.sonra = null;
    if (sayfa.donus === 'kesfet' && !sonra) sekmeyeGec('kesfet');
    else { if (harita) harita.invalidateSize({ pan: false }); guncelle(); }
    if (sayfa.ortalanacak) { haritadaOrtala(sayfa.ortalanacak); sayfa.ortalanacak = null; }
    if (sonra) { sonra(); return; }
    const geri = sayfa.odakGeri && sayfa.odakGeri.isConnected ? sayfa.odakGeri : kok.querySelector(`.kart[data-id="${id}"] .kart-bas`);
    if (geri) {
      geri.focus({ preventScroll: true });
      const kart = geri.closest('.kart');
      if (kart) kart.scrollIntoView({ block: 'nearest' });
    }
  }

  function bolum(baslik, etiket, ...govde) {
    return el('section', { class: 'ms-bolum', 'aria-label': baslik },
      el('div', { class: 'ms-bolum-bas' }, el('h3', { text: baslik }), etiket), govde);
  }
  function hizliDugme(metin, simgeAdi, oz, is) {
    const d = el(oz.href ? 'a' : 'button', { class: 'ms-hizli-dugme', ...(oz.href ? {} : { type: 'button' }), ...oz }, simge(simgeAdi), metin);
    if (is) d.addEventListener('click', is);
    return d;
  }
  function sayfaEylemleri(m) {
    const paylas = el('button', { class: 'favori', type: 'button', title: 'Bağlantıyı kopyala', 'aria-label': `${m.ad}: sayfa bağlantısını kopyala` }, simge('paylas'));
    paylas.addEventListener('click', async () => {
      let metin = 'Bağlantıyı adres çubuğundan kopyalayabilirsin.';
      try { await navigator.clipboard.writeText(mekanBaglantisi(m.id)); metin = 'Sayfa bağlantısı kopyalandı.'; } catch (e) { /* adres çubuğunda zaten var */ }
      $('#msDurum').textContent = metin;
      setTimeout(() => { const d = $('#msDurum'); if (d) d.textContent = ''; }, 2500);
    });
    return [listeDugmesi(m), favoriDugmesi(m), paylas];
  }

  function mekanSayfasiniCiz(m) {
    const kat = kategoriler[m.kategori];
    const bekleyen = new Set(m.dogrulanacak || []);
    const teyit = alan => (bekleyen.has(alan) ? el('span', { class: 'teyit', text: 'teyit bekliyor' }) : null);
    const uzak = konum.son && m.konum ? uzaklik(konum.son, m.konum) : null;

    const geri = el('button', { class: 'ms-geri', type: 'button', 'aria-label': 'Geri', title: 'Geri' }, simge('geri'));
    geri.addEventListener('click', () => sayfayiKapat());
    const ust = el('div', { class: 'ms-ust' }, geri, el('p', { class: 'ms-ust-ad', 'aria-hidden': 'true', text: m.ad }),
      el('div', { class: 'ms-eylem', id: 'msEylem' }, sayfaEylemleri(m)));

    // Başlık
    const bas = el('header', { class: 'ms-bas' },
      el('p', { class: 'ms-tur' }, el('span', { class: 'levha', 'aria-hidden': 'true', text: kategoriHarfi(m.kategori) }), turEtiketi(m)),
      el('h2', { class: 'ms-ad', id: 'msAd', tabindex: '-1', text: m.ad }),
      el('p', { class: 'ms-yer' },
        uzak != null ? el('span', { class: 'uzaklik', title: 'Kuş uçuşu uzaklık' }, el('span', { class: 'gorunmez', text: 'Uzaklık: ' }), uzaklikYaz(uzak)) : null,
        `${m.ilce}, ${m.il}`),
      puanOzetSatiri(m),
      el('p', { class: 'gorunmez', id: 'msDurum', role: 'status', 'aria-live': 'polite' }));

    // Hızlı eylemler
    const hizli = [];
    if (m.telefon) hizli.push(hizliDugme('Ara', 'tel', { href: `tel:${m.telefon.replace(/\s/g, '')}` }));
    if (m.konum) hizli.push(hizliDugme('Yol tarifi', 'yol', { href: `https://www.google.com/maps/dir/?api=1&destination=${m.konum.lat},${m.konum.lng}`, target: '_blank', rel: 'noopener noreferrer' }));
    if (/^https:\/\//.test(m.web || '')) hizli.push(hizliDugme('Web sitesi', 'web', { href: m.web, target: '_blank', rel: 'noopener noreferrer' }));
    if (m.konum) hizli.push(hizliDugme('Haritada', 'harita', {}, () => {
      if (harita && harita.getContainer().offsetWidth) haritadaOrtala(m.id);
      else { sayfa.ortalanacak = m.id; sayfayiKapat(() => sekmeyeGec('harita')); }
    }));

    // İşletmenin anlattıkları (işletme beyanı)
    const beyan = beyanGetir(m);
    let beyanBolumu;
    if (beyan) {
      const kutular = (Array.isArray(beyan.alanlar) ? beyan.alanlar : [])
        .filter(a => a && typeof a.baslik === 'string' && typeof a.metin === 'string' && a.metin.trim())
        .map(a => el('div', { class: 'ms-kutu' }, el('h4', { text: a.baslik.slice(0, 60) }), el('p', { text: a.metin.slice(0, 1000) })));
      const saatler = (Array.isArray(beyan.saatler) ? beyan.saatler : []).filter(s => s && typeof s.gun === 'string' && typeof s.saat === 'string');
      beyanBolumu = bolum('İşletmenin anlattıkları', el('span', { class: 'ms-etiket beyan', text: 'İşletme beyanı' }),
        typeof beyan.aciklama === 'string' && beyan.aciklama.trim() ? el('p', { class: 'ms-aciklama', text: beyan.aciklama.slice(0, 2000) }) : null,
        saatler.length ? el('div', { class: 'ms-kutu' }, el('h4', { text: 'Çalışma saatleri' }),
          el('ul', { class: 'ms-satirlar' }, saatler.map(s => el('li', { class: 'ms-satir' }, el('span', { class: 'ms-satir-ad', text: s.gun }), el('span', { class: 'ms-satir-deger', text: s.saat }))))) : null,
        kutular.length ? el('div', { class: 'ms-kutular' }, kutular) : null,
        el('p', { class: 'ms-not', text: `Bu bölümü işletme doldurdu${beyan.guncellenme ? ` (${tarihYaz(beyan.guncellenme)})` : ''}; Keşif bu bilgileri doğrulamadı.` }));
    } else {
      beyanBolumu = bolum('İşletmenin anlattıkları', null,
        el('div', { class: 'ms-bos' },
          el('p', { text: 'Bu sayfa henüz işletme tarafından doldurulmadı.' }),
          el('p', { text: 'İşletme sahipleri yakında sayfalarını sahiplenip açıklama, çalışma saatleri ve fotoğraf ekleyebilecek. Bu bilgiler "İşletme beyanı" etiketiyle, aşağıdaki derlenmiş bilgilerden ayrı görünecek.' })));
    }

    // Özellikler: kategori tanımından. Önce bilinen bilgiler (tarife, kapasite…), sonra filtre alanları.
    const bilgiSatirlari = bilgiler(m.kategori).map(b => {
      const y = bilgiYaz(b, m.ozellikler[b.alan]);
      if (!y) return null;
      if (Array.isArray(y)) return el('li', { class: 'ms-satir genis' },
        el('span', { class: 'ms-satir-ad' }, el('strong', { text: b.etiket }), teyit(b.alan)),
        el('ul', { class: 'ms-liste' }, y.map(s => el('li', { text: s }))));
      const deger = el('span', { class: 'ms-satir-deger', text: y });
      const t = teyit(b.alan);
      if (t) deger.append(t);
      return el('li', { class: 'ms-satir' }, el('span', { class: 'ms-satir-ad', text: b.etiket }), deger);
    }).filter(Boolean);
    const satirlar = bilgiSatirlari.concat(filtreler(m.kategori).filter(f => !(f.seyrek && m.ozellikler[f.alan] == null)).map(f => {
      const v = m.ozellikler[f.alan];
      if (f.tip === 'coklu' && v != null && v.length) {
        const aranan = durum.secimler[f.alan] || new Set();
        const secenekler = f.secenekler.filter(o => v.includes(o.deger));
        const liste = el('ul', { class: secenekler.length > 40 ? 'ms-cipler uzun' : 'ms-cipler' },
          secenekler.map(o => el('li', { class: aranan.has(o.deger) ? 'aranan' : null, text: o.etiket })));
        let ara = null;
        if (secenekler.length > 40) {
          ara = el('input', { type: 'search', class: 'ara', placeholder: `${f.etiket} içinde ara`, 'aria-label': `${f.etiket} içinde ara`, autocomplete: 'off' });
          ara.addEventListener('input', () => { const q = duz(ara.value); for (const li of liste.children) li.hidden = !!q && !duz(li.textContent).includes(q); });
        }
        return el('li', { class: 'ms-satir genis' },
          el('span', { class: 'ms-satir-ad' }, el('strong', { text: `${f.etiket} (${secenekler.length})` }), teyit(f.alan)), ara, liste);
      }
      let deger;
      if (v == null || (f.tip === 'coklu' && !v.length)) deger = el('span', { class: 'ms-satir-deger olgu bilinmiyor' }, simge('bilinmiyor'), 'bilinmiyor');
      else if (f.tip === 'secim') deger = el('span', { class: 'ms-satir-deger', text: secenekEtiketi(f, v) });
      else deger = el('span', { class: `ms-satir-deger olgu ${v ? 'var' : 'yok'}` }, simge(v ? 'var' : 'yok'), v ? 'var' : 'yok');
      const t = teyit(f.alan);
      if (t) deger.append(t);
      return el('li', { class: 'ms-satir' }, el('span', { class: 'ms-satir-ad', text: f.etiket }), deger);
    }));
    // Kategori filtresinde olmayan ortak özellikler: yalnızca bilinenler.
    for (const o of ORTAK_OZELLIKLER) {
      const v = m.ozellikler[o.alan];
      if (typeof v !== 'boolean' || filtreler(m.kategori).some(f => f.alan === o.alan)) continue;
      const deger = el('span', { class: `ms-satir-deger olgu ${v ? 'var' : 'yok'}` }, simge(v ? 'var' : 'yok'), v ? 'var' : 'yok');
      satirlar.push(el('li', { class: 'ms-satir' }, el('span', { class: 'ms-satir-ad', text: o.etiket }), deger));
    }
    const ozellikler = satirlar.length
      ? bolum('Özellikler', el('span', { class: 'ms-etiket', text: 'Keşif derledi' }), el('ul', { class: 'ms-satirlar' }, satirlar))
      : null;

    // İletişim ve konum
    const iletisim = adresYaklasik(m)
      ? [el('dt', { text: 'Yaklaşık adres' }), el('dd', null, m.adres, el('span', { class: 'teyit', text: 'konumdan üretildi' }),
          el('span', { class: 'aciklama yaklasik-not', text: 'Kaynakta adres yoktu; mahalle ve sokak, yerin haritadaki konumuna en yakın kayıtlardan bulundu. Kapı numarası yok.' }))]
      : [el('dt', { text: 'Adres' }), el('dd', null, m.adres || el('span', { class: 'bilinmiyor', text: 'bilinmiyor' }), teyit('adres'))];
    if (m.telefon) {
      const no = el('a', { class: 'tel', href: `tel:${m.telefon.replace(/\s/g, '')}`, text: m.telefon });
      const kopya = el('button', { class: 'bag kopya', type: 'button', text: 'Kopyala' });
      kopya.addEventListener('click', () => kopyala(m.telefon, kopya, no));
      iletisim.push(el('dt', { text: 'Telefon' }), el('dd', null, no, kopya, teyit('telefon')));
    }
    if (/^https:\/\//.test(m.web || '')) {
      let gorunen = m.web;
      try { gorunen = new URL(m.web).hostname.replace(/^www\./, ''); } catch (e) { /* olduğu gibi */ }
      iletisim.push(el('dt', { text: 'Web' }), el('dd', null, el('a', { href: m.web, target: '_blank', rel: 'noopener noreferrer', text: gorunen }), teyit('web')));
    }
    const oz = m.ozellikler || {};
    if (/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(oz.eposta || '')) {
      iletisim.push(el('dt', { text: 'E-posta' }), el('dd', null, el('a', { href: `mailto:${oz.eposta}`, text: oz.eposta })));
    }
    const sosyal = [['instagram', 'Instagram'], ['facebook', 'Facebook']]
      .filter(([k]) => /^https:\/\/(www\.|m\.)?(instagram|facebook)\.com\//.test(oz[k] || ''))
      .map(([k, ad]) => el('a', { href: oz[k], target: '_blank', rel: 'noopener noreferrer', text: ad }));
    if (sosyal.length) iletisim.push(el('dt', { text: 'Sosyal medya' }), el('dd', { class: 'ms-sosyal' }, sosyal.flatMap((a, i) => (i ? [' · ', a] : [a]))));
    iletisim.push(el('dt', { text: 'Bölge' }), el('dd', { text: `${m.ilce}, ${m.il}` }));
    const konumNotu = !m.konum ? 'Haritadaki yeri henüz işaretlenmedi.'
      : bekleyen.has('konum') ? 'Haritadaki yeri yaklaşık olabilir, teyit bekliyor.' : null;
    const iletisimBolumu = bolum('İletişim ve konum', null, el('dl', { class: 'ms-iletisim' }, iletisim),
      konumNotu ? el('p', { class: 'uyari-not', text: konumNotu }) : null);

    // Yakındaki benzer yerler: aynı kategoride, bu kayda en yakın 5 yer
    let yakinBolumu = null;
    if (m.konum) {
      const yakinlar = mekanlar.filter(x => x.id !== m.id && x.kategori === m.kategori && x.konum)
        .map(x => ({ x, d: uzaklik(m.konum, x.konum) })).sort((a, b) => a.d - b.d).slice(0, 5);
      if (yakinlar.length) {
        yakinBolumu = el('section', { class: 'raf ms-yakin', 'aria-label': `Yakındaki ${kat.ad.toLocaleLowerCase(TR)}` },
          el('h3', { class: 'raf-baslik', text: 'Yakındaki benzer yerler' }),
          el('ul', { class: 'satirlar' }, yakinlar.map(({ x, d }) => satir(x, levhaSol(kategoriHarfi(x.kategori), 'harf'),
            el('span', { class: 'olcu', title: `${m.ad} kaydına kuş uçuşu uzaklık` }, uzaklikYaz(d)), 'yakin'))));
      }
    }

    // Kaynak
    const osm = /^(node|way|relation)\/\d+$/.test(m.osm_ref || '')
      ? el('p', null, 'Kaynak: ', el('a', { href: `https://www.openstreetmap.org/${m.osm_ref}`, target: '_blank', rel: 'noopener noreferrer', text: 'OpenStreetMap katkıcıları' }), ' (ODbL)')
      : null;
    const kaynak = el('footer', { class: 'ms-kaynak' },
      el('p', { text: `Bilgi tarihi: ${tarihYaz(m.dogrulama_tarihi)}` }), osm,
      kat.bilgi_notu ? el('p', { text: kat.bilgi_notu }) : null);

    $('#mekanSayfa').replaceChildren(ust, el('div', { class: 'ms-govde' },
      bas, hizli.length ? el('div', { class: 'ms-hizli' }, hizli) : null,
      (b => b.length ? el('div', { class: 'kat-baglanti' }, b) : null)(kategoriBaglantilari(m.kategori, m.il)),
      fotoBolumu(m), puanBolumu(m),
      beyanBolumu, ozellikler, iletisimBolumu, yakinBolumu, kaynak));
    fotolariGetir(m.id);
    sayacGetir(sayac.puan);
  }

  /* ---------- işletme sayfası: puan ---------- */
  function puanOzetSatiri(m) {
    const p = puanOzeti(m);
    if (!p || !p.sayi) return el('p', { class: 'ms-puan-ozet', id: 'msPuanOzet', hidden: true });
    return el('p', { class: 'ms-puan-ozet', id: 'msPuanOzet' }, simge('yildiz'), el('strong', { text: virgul(p.ort) }), ` · ${p.sayi} puan`);
  }
  function yildizlar(n, sinif) {
    return el('span', { class: `yildizlar${sinif ? ` ${sinif}` : ''}`, 'aria-hidden': 'true' },
      [1, 2, 3, 4, 5].map(i => { const s = simge('yildiz'); if (i <= Math.round(n)) s.classList.add('dolu'); return s; }));
  }
  function puanBolumu(m) {
    if (!puanlamaAcik(m.kategori)) return null;
    const p = puanOzeti(m);
    const benim = benimPuanlarim[m.id] || 0;
    let ozet;
    if (p && p.sayi) {
      const enCok = Math.max(...p.dagilim, 1);
      ozet = el('div', { class: 'ms-puan' },
        el('div', { class: 'ms-puan-sol' },
          el('span', { class: 'ms-puan-sayi', text: virgul(p.ort) }), yildizlar(p.ort),
          el('span', { class: 'ms-puan-adet', text: `${p.sayi} puan` })),
        el('ul', { class: 'ms-dagilim', 'aria-label': 'Yıldız dağılımı' }, [5, 4, 3, 2, 1].map(y => {
          const n = p.dagilim[y - 1] || 0;
          return el('li', null, el('span', { class: 'ms-dagilim-y', text: `${y}` }, simge('yildiz')),
            el('span', { class: 'ms-dagilim-cubuk' }, el('span', { style: `width:${Math.round((n / enCok) * 100)}%` })),
            el('span', { class: 'ms-dagilim-n', text: String(n), 'aria-label': `${y} yıldız: ${n}` }));
        })));
    } else {
      ozet = el('p', { class: 'ms-bos', text: sayac.puan.durum === 'hata' && !sayac.puan.harita ? 'Puanlar şu an alınamadı.' : 'Henüz puan verilmedi. İlk puanı sen ver.' });
    }
    const dugmeler = [1, 2, 3, 4, 5].map(i => {
      const b = el('button', { class: `puan-dugme${i <= benim ? ' dolu' : ''}`, type: 'button', role: 'radio', 'aria-checked': String(i === benim),
        'aria-label': `${i} yıldız`, title: `${i} yıldız`, 'data-puan': i }, simge('yildiz'));
      b.addEventListener('click', () => puanVer(m, i));
      return b;
    });
    const kaldir = benim ? el('button', { class: 'bag', type: 'button', text: 'Puanımı kaldır' }) : null;
    if (kaldir) kaldir.addEventListener('click', () => puanVer(m, null));
    return el('section', { class: 'ms-bolum', id: 'msPuan', 'aria-label': 'Puanlar' },
      el('div', { class: 'ms-bolum-bas' }, el('h3', { text: 'Puanlar' })),
      ozet,
      el('div', { class: 'ms-puan-ver' },
        el('span', { class: 'ms-puan-ver-etiket', id: 'msPuanEtiket', text: benim ? 'Senin puanın' : 'Puan ver' }),
        el('div', { class: 'puan-dugmeler', role: 'radiogroup', 'aria-labelledby': 'msPuanEtiket' }, dugmeler),
        kaldir),
      el('p', { class: 'ms-not', id: 'msPuanDurum', role: 'status', 'aria-live': 'polite' }),
      el('p', { class: 'ms-not', text: 'Puanlar adsız bir cihaz numarasıyla tutulur; her cihaz bir yere bir puan verir, sonradan değiştirebilir.' }));
  }
  // Puan özeti gelince ya da puan verilince sayfadaki puan bölümü yerinde yenilenir (odak ve durum iletisi korunur).
  function puanBolumunuYenile() {
    if (!durum.sayfa) return;
    const m = mekanBul(durum.sayfa);
    const eski = $('#msPuan');
    if (!m || !eski) return;
    const odak = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.puan : null;
    const ileti = ($('#msPuanDurum') || {}).textContent || '';
    const yeni = puanBolumu(m);
    if (yeni) eski.replaceWith(yeni);
    $('#msPuanDurum').textContent = ileti;
    $('#msPuanOzet').replaceWith(puanOzetSatiri(m));
    if (odak) { const b = $(`#msPuan [data-puan="${odak}"]`); if (b) b.focus(); }
  }

  /* ---------- işletme sayfası: fotoğraflar ---------- */
  // Fotoğraflar "mekan-foto" deposundan herkese açık bağlantıyla gelir; listesi mekan_foto tablosunda.
  // Yöneticiler yönetim sayfasından yükler (işletme sahibi hesabı gelince sahip de yükleyecek). Hak: mekan başına foto_hakki.
  const fotoOnbellek = new Map();   // mekan kimliği → { durum: 'yukleniyor' | 'tamam' | 'hata', liste }
  const fotoAdresi = yol => `${AYAR.veritabani.url}/storage/v1/object/public/mekan-foto/${yol.split('/').map(encodeURIComponent).join('/')}`;
  async function fotolariGetir(id) {
    const var_ = fotoOnbellek.get(id);
    if (var_ && var_.durum !== 'hata') return;
    if (!AYAR.veritabani) { fotoOnbellek.set(id, { durum: 'tamam', liste: [] }); fotoBolumunuYenile(id); return; }
    fotoOnbellek.set(id, { durum: 'yukleniyor', liste: [] });
    try {
      const { url, anahtar } = AYAR.veritabani;
      const y = await fetch(`${url}/rest/v1/mekan_foto?select=id,yol,kucuk_yol,genislik,yukseklik,kaynak&mekan_id=eq.${encodeURIComponent(id)}&order=sira.asc,eklenme.asc`,
        { headers: { apikey: anahtar, Accept: 'application/json' } });
      if (!y.ok) throw new Error(`mekan_foto: ${y.status}`);
      const liste = (await y.json()).filter(f => f && typeof f.yol === 'string' && typeof f.kucuk_yol === 'string');
      fotoOnbellek.set(id, { durum: 'tamam', liste });
    } catch (hata) {
      console.warn('Fotoğraflar alınamadı:', hata);
      fotoOnbellek.set(id, { durum: 'hata', liste: [] });
    }
    fotoBolumunuYenile(id);
  }
  function fotoBolumunuYenile(id) {
    if (durum.sayfa !== id) return;
    const eski = $('#msFoto'), m = mekanBul(id);
    if (eski && m) eski.replaceWith(fotoBolumu(m));
  }
  function fotoBolumu(m) {
    const f = fotoOnbellek.get(m.id) || { durum: 'yukleniyor', liste: [] };
    let govde;
    if (f.durum === 'yukleniyor') govde = el('p', { class: 'ms-bos', text: 'Fotoğraflar yükleniyor…' });
    else if (f.durum === 'hata') govde = el('p', { class: 'ms-bos', text: 'Fotoğraflar şu an alınamadı.' });
    else if (!f.liste.length) govde = el('p', { class: 'ms-bos', text: 'Henüz fotoğraf yok.' });
    else govde = el('ul', { class: 'ms-fotolar' }, f.liste.map((x, i) => {
      const b = el('button', { class: 'ms-foto', type: 'button', 'aria-label': `${i + 1}. fotoğrafı büyüt` },
        el('img', { src: fotoAdresi(x.kucuk_yol), alt: '', loading: 'lazy', decoding: 'async', width: 480, height: 360 }));
      b.addEventListener('click', () => fotoKutusunuAc(m, i));
      return el('li', null, b);
    }));
    const etiket = f.liste.length ? el('span', { class: 'ms-etiket', text: `${f.liste.length} fotoğraf` }) : null;
    return el('section', { class: 'ms-bolum', id: 'msFoto', 'aria-label': 'Fotoğraflar' },
      el('div', { class: 'ms-bolum-bas' }, el('h3', { text: 'Fotoğraflar' }), etiket), govde);
  }
  // Büyük görünüm: önceki/sonraki (ok tuşları da), Esc ya da dışına tıklayınca kapanır.
  function fotoKutusunuAc(m, i) {
    const f = fotoOnbellek.get(m.id);
    if (!f || !f.liste.length) return;
    const kutu = $('#fotoKutusu');
    let sira = i;
    const resim = el('img', { class: 'fk-resim', alt: '' });
    const yazi = el('p', { class: 'fk-yazi', role: 'status', 'aria-live': 'polite' });
    const git = n => {
      sira = (n + f.liste.length) % f.liste.length;
      const x = f.liste[sira];
      resim.src = fotoAdresi(x.yol);
      if (x.genislik && x.yukseklik) { resim.width = x.genislik; resim.height = x.yukseklik; }
      resim.alt = `${m.ad}: ${sira + 1}. fotoğraf`;
      yazi.textContent = `${sira + 1} / ${f.liste.length} · ${x.kaynak === 'isletme' ? 'İşletme yükledi' : 'Keşif yükledi'}`;
    };
    const dugme = (sinif, etiket, simgeAdi, is) => { const b = el('button', { class: `fk-dugme ${sinif}`, type: 'button', 'aria-label': etiket, title: etiket }, simge(simgeAdi)); b.addEventListener('click', is); return b; };
    const kapat = dugme('fk-kapat', 'Kapat', 'yok', () => kutu.close());
    const coklu = f.liste.length > 1;
    kutu.replaceChildren(el('div', { class: 'fk-ic' },
      kapat, resim,
      coklu ? dugme('fk-onceki', 'Önceki fotoğraf', 'geri', () => git(sira - 1)) : null,
      coklu ? dugme('fk-sonraki', 'Sonraki fotoğraf', 'geri', () => git(sira + 1)) : null,
      yazi));
    kutu.onkeydown = e => {
      if (!coklu) return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); git(sira - 1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); git(sira + 1); }
    };
    git(i);
    if (!kutu.open) kutu.showModal();
    kapat.focus();
  }

  function oneriUygula(o) {
    const iller = new Set([...mekanlar.map(m => m.il), ...[...bolge.sayim.keys()].map(a => a.split('|')[1])]);
    const sayim = new Map([...iller].map(il => [il, oneriSayisi(o, il)]).filter(([, n]) => n > 0));
    const il = sayim.has(durum.il) ? durum.il : [...sayim].sort((a, b) => b[1] - a[1])[0][0];
    sekmeyeGec('harita');
    durum.gorunum = '';
    grubaGit(il, o.k, false);
    if (o.tur === 'filtre') durum.secimler[o.f.alan] = o.f.tip === 'coklu' ? new Set([o.deger]) : o.deger;
    $('#aramaGir').value = '';
    baglamiYaz(); filtreleriCiz(); bolgeyiCiz();
    guncelle();
    $('#sonuclar').scrollTop = 0;
  }

  /* ---------- çekmece (dar ekranda filtre paneli) ---------- */
  const dar = window.matchMedia('(max-width: 1099.98px)');
  const panel = $('#panel');
  function paneliAyarla(acik, odakla) {
    const cekmece = dar.matches;
    const gorunur = cekmece && acik;
    panel.classList.toggle('acik', gorunur);
    panel.inert = cekmece && !acik;
    $('#perde').hidden = !gorunur;
    $('#filtreAc').setAttribute('aria-expanded', String(gorunur));
    if (cekmece) { panel.setAttribute('role', 'dialog'); panel.setAttribute('aria-modal', 'true'); }
    else { panel.removeAttribute('role'); panel.removeAttribute('aria-modal'); }
    for (const b of [$('.ust'), $('#sonuclar'), $('.harita-kap'), $('#kesfet'), $('#mekanSayfa'), $('.sekmeler-alt')]) b.inert = gorunur;
    if (odakla) (gorunur ? $('#panelKapat') : $('#filtreAc')).focus();
  }

  /* ---------- başlat ---------- */
  async function baslat() {
    gorunumKur();
    try {
      let sayilar, secenekler;
      ({ kategoriler, mekanlar, sinirlar, sayilar, secenekler } = await veriyiGetir());
      kategoriler = { [TUMU]: TUMU_TANIM, ...kategoriler };   // "Tümü" listenin başında ve açılışta seçili
      for (const m of mekanlar) bolge.dizin.set(m.id, m);
      sayimlariKur(sayilar, secenekler);
      // Favorilerde, listelerde, paylaşılan listede ve bağlantıda geçen ama büyük kategoride olduğu için yüklenmemiş kayıtlar.
      const hashId = mekanHashi();
      let paylasimIdleri = [];
      try { const h = location.hash; if (h.startsWith('#liste=')) { const v = JSON.parse(b64.oku(h.slice(7))); if (v && Array.isArray(v.m)) paylasimIdleri = v.m.slice(0, 500); } } catch (e) { /* bozuk bağlantı */ }
      await kimlikleriYukle([...favoriler, ...listeler.flatMap(l => l.mekanlar), ...paylasimIdleri, ...(hashId ? [hashId] : [])]);
    } catch (hata) {
      $('#sonucSayi').textContent = 'Veri yüklenemedi';
      const not = $('#sonucNot');
      not.textContent = 'Sayfayı yenileyip yeniden dene.';
      not.hidden = false;
      console.error(hata);
      return;
    }
    // İl listesi: haritası açılan her il. Sınırı olmayan bir ilde kayıt varsa o il de listeye girer (harita kayıtlara sığdırılır).
    // İlçe listesi ayrı bir seçimdir; seçili il ve kategoride kaydı olan ilçeleri gösterir (bkz. ilceleriCiz).
    const iller = Object.keys(sinirlar.iller || {});
    const kayitIlleri = [...mekanlar.map(m => m.il), ...[...bolge.sayim.keys()].map(a => a.split('|')[1])];
    for (const il of [...new Set(kayitIlleri)].sort((a, b) => a.localeCompare(b, TR))) if (!iller.includes(il)) iller.push(il);
    const ilSec = $('#ilSec'), ilceSec = $('#ilceSec'), kategoriSec = $('#kategoriSec');
    ilSec.replaceChildren(...iller.map(il => el('option', { value: il, text: il })));
    kategoriSec.replaceChildren(...Object.entries(kategoriler).map(([k, v]) => el('option', { value: k, text: v.ad })));
    durum.il = ilSec.value; durum.ilce = TUM;
    durum.kategori = kategoriSec.value;
    ilceleriCiz();

    ilSec.addEventListener('change', () => {
      durum.il = ilSec.value; durum.ilce = TUM;   // il değişince ilçe seçimi sıfırlanır
      durum.secili = null; durum.alan = null;
      ilceleriCiz(); baglamiYaz(); bolgeyiCiz(); guncelle();
    });
    ilceSec.addEventListener('change', () => {
      durum.ilce = ilceSec.value;
      durum.secili = null; durum.alan = null;
      baglamiYaz(); bolgeyiCiz(); guncelle();
    });
    kategoriSec.addEventListener('change', () => {
      durum.kategori = kategoriSec.value;
      durum.secimler = {}; durum.secili = null;
      if (durum.kategori === TUMU) { durum.alan = null; taraGoster(false); }   // "Tümü" alanı kendisi izler
      const onceki = durum.ilce;
      ilceleriCiz();   // seçili ilçede bu kategoriden kayıt yoksa "Tüm ilçeler"e döner
      baglamiYaz(); filtreleriCiz();
      if (onceki !== durum.ilce) bolgeyiCiz();
      guncelle();
    });
    $('#temizle').addEventListener('click', filtreleriTemizle);
    $('#siralaSec').addEventListener('change', e => {
      durum.siralama = e.target.value; durum.siralamaElle = true;
      if (durum.siralama === 'yakinlik' && !konum.aktif && konum.dugme) konumuAc();
      guncelle();
    });
    $('#gorunumSec').addEventListener('change', e => gorunumeGec(e.target.value, true));
    $('#listeYonet').addEventListener('click', () => listelerDiyalogu());
    const diyalog = $('#diyalog');
    diyalog.addEventListener('click', e => { if (e.target === diyalog) diyalog.close(); });   // dışına tıklayınca kapanır
    diyalog.addEventListener('close', guncelle);
    const fotoKutusu = $('#fotoKutusu');
    fotoKutusu.addEventListener('click', e => { if (e.target === fotoKutusu || e.target.classList.contains('fk-ic')) fotoKutusu.close(); });
    let fotoOdak = null;
    fotoKutusu.addEventListener('close', () => { fotoKutusu.replaceChildren(); if (fotoOdak && fotoOdak.isConnected) fotoOdak.focus(); });
    document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('.ms-foto'); if (b) fotoOdak = b; }, true);
    // Adres değişimi: #mekan=<kimlik> işletme sayfasını açar (geri/ileri tuşları dahil), #liste= paylaşılan listeyi.
    window.addEventListener('hashchange', () => {
      const id = mekanHashi();
      if (id && sayfa.tamamen) {   // sekmeyle kapatırken bağlantıyla açılmış ilk sayfaya düşüldü: o da kapanır
        sayfa.tamamen = false;
        history.replaceState(null, '', location.pathname + location.search);
        if (durum.sayfa) sayfaKapandi();
        return;
      }
      sayfa.tamamen = false;
      if (id) {
        const ac = () => {
          if (mekanHashi() !== id) return;   // bu arada adres değiştiyse vazgeç
          const m = mekanBul(id);
          if (m && id !== durum.sayfa) mekanSayfasiniAc(m, { kaynak: 'gecmis', gecmis: false });
          if (!m) { history.replaceState(null, '', location.pathname + location.search); if (durum.sayfa) sayfaKapandi(); }
        };
        if (mekanBul(id)) ac(); else kimlikleriYukle([id]).then(ac);   // büyük kategoriden bir kayıt olabilir
        return;
      }
      if (durum.sayfa) sayfaKapandi();
      const yeniPaylasim = () => {
        const p = paylasimiOku();
        if (p && (!paylasilan || JSON.stringify(p) !== JSON.stringify(paylasilan))) { paylasilan = p; gorunumeGec('paylasilan', true); }
      };
      let ids = [];
      try { if (location.hash.startsWith('#liste=')) { const v = JSON.parse(b64.oku(location.hash.slice(7))); if (v && Array.isArray(v.m)) ids = v.m.slice(0, 500); } } catch (e) { /* bozuk */ }
      if (ids.length) kimlikleriYukle(ids).then(yeniPaylasim); else yeniPaylasim();
    });
    paylasilan = paylasimiOku();
    if (paylasilan) gorunumeGec('paylasilan', false);
    $('#filtreAc').addEventListener('click', () => paneliAyarla(true, true));
    $('#panelKapat').addEventListener('click', () => paneliAyarla(false, true));
    $('#panelUygula').addEventListener('click', () => paneliAyarla(false, true));
    $('#perde').addEventListener('click', () => paneliAyarla(false, true));
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (panel.classList.contains('acik')) paneliAyarla(false, true);
      else if (durum.sayfa && !$('#diyalog').open && !$('#fotoKutusu').open && !(e.target.matches && e.target.matches('input') && e.target.value)) sayfayiKapat();
    });
    dar.addEventListener('change', () => paneliAyarla(false, false));

    // Sekmeler, arama ve Keşfet
    for (const b of kok.querySelectorAll('.sekmeler-alt [data-sekme]')) b.prepend(simge(b.dataset.sekme === 'kesfet' ? 'pusula' : 'harita'));
    $('#araAc').prepend(simge('ara'));
    $('#aramaForm').prepend(simge('ara'));
    // Sayfa açıkken sekmeye ya da aramaya basılınca önce sayfa kapanır (geçmişten bir adım geri), sonra istenen yere geçilir.
    for (const b of kok.querySelectorAll('[data-sekme]')) b.addEventListener('click', () => sayfayiKapat(() => sekmeyeGec(b.dataset.sekme), true));
    $('#araAc').addEventListener('click', () => sayfayiKapat(() => { sekmeyeGec('kesfet'); $('#aramaGir').focus(); $('#aramaGir').select(); }, true));
    let aramaBekliyor = null;
    $('#aramaGir').addEventListener('input', () => { clearTimeout(aramaBekliyor); aramaBekliyor = setTimeout(kesfetCiz, 120); });
    $('#aramaGir').addEventListener('keydown', e => { if (e.key === 'Escape' && e.target.value) { e.preventDefault(); e.target.value = ''; kesfetCiz(); } });
    $('#aramaForm').addEventListener('submit', e => { e.preventDefault(); clearTimeout(aramaBekliyor); kesfetCiz(); $('#aramaGir').blur(); });
    if (favoriler.size || cihazNumarasi(false)) esitleGonder(false);   // daha önce yalnızca tarayıcıda tutulan favoriler de sayıma girer

    paneliAyarla(false, false);
    baglamiYaz();
    filtreleriCiz();
    haritaKur();
    guncelle();
    sayacGetir(sayac.puan);   // puanlar gelince liste puana göre yeniden sıralanır
    // Bağlantıyla gelindiyse (#mekan=<kimlik>) işletme sayfası açılır; kimlik bilinmiyorsa adres temizlenir.
    const ilkId = mekanHashi();
    if (ilkId) {
      const m = mekanBul(ilkId);
      if (m) mekanSayfasiniAc(m, { kaynak: 'baglanti', gecmis: false });
      else history.replaceState(null, '', location.pathname + location.search);
    }
  }
  baslat();
})();
</script>

</html>
